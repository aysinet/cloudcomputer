  finance: { tr: 'Finans', en: 'Finance', de: 'Finanzen', fr: 'Finance', es: 'Finanzas', ru: 'Финансы', zh: '金融', ja: 'ファイナンス', it: 'Finanza' },
  other: { tr: 'Diğer', en: 'Other', de: 'Sonstige', fr: 'Autres', es: 'Otros', ru: 'Другое', zh: '其他', ja: 'その他', it: 'Altro' }
};
function getAppCatName(catId, locale) {
  const names = APP_CATEGORY_NAMES[catId];
  return names ? (names[locale] || names.tr) : catId;
}

/* ── AppStoreApp ── */
const AppStoreApp = {
  template: '#AppStoreApp',
  setup() {
    const storeApps = ref([]);
    const loading = ref(true);

    async function getAuthHeaders() {
      const cookies = document.cookie.split(';').reduce((acc, c) => { const [k, ...v] = c.trim().split('='); acc[k] = v.join('='); return acc; }, {});
      return { 'Content-Type': 'application/json' };
    }

    async function loadStore() {
      loading.value = true;
      try {
        const res = await fetch('/api/store', { headers: await getAuthHeaders() });
        if (res.ok) storeApps.value = await res.json();
      } catch (e) { console.error('Store load error', e); }
      loading.value = false;
    }

    async function install(app) {
      try {
        const res = await fetch('/api/apps/install', {
          method: 'POST',
          headers: await getAuthHeaders(),
          body: JSON.stringify({ appId: app.id })
        });
        if (res.ok) {
          app.installed = true;
          window.dispatchEvent(new CustomEvent('app-installed', { detail: app }));
        }
      } catch (e) { console.error('Install error', e); }
    }

    async function uninstall(app) {
      try {
        const res = await fetch('/api/apps/uninstall', {
          method: 'POST',
          headers: await getAuthHeaders(),
          body: JSON.stringify({ appId: app.id })
        });
        if (res.ok) {
          app.installed = false;
          window.dispatchEvent(new CustomEvent('app-uninstalled', { detail: { id: app.id } }));
        }
      } catch (e) { console.error('Uninstall error', e); }
    }

    onMounted(() => loadStore());

    const STORE_CAT_META = APP_CATEGORY_META;
    const STORE_CAT_NAMES = APP_CATEGORY_NAMES;

    const activeCategory = ref('');

    const storeCategories = computed(() => {
      const cats = {};
      storeApps.value.forEach(app => {
        const c = app.category || 'other';
        if (!cats[c]) cats[c] = [];
        cats[c].push(app);
      });
      const loc = useSettingsStore().locale;
      return Object.keys(cats)
        .sort((a, b) => (STORE_CAT_META[a]?.order || 99) - (STORE_CAT_META[b]?.order || 99))
        .map(c => ({
          id: c,
          icon: STORE_CAT_META[c]?.icon || '📦',
          name: (STORE_CAT_NAMES[c] || {})[loc] || (STORE_CAT_NAMES[c] || {}).tr || c,
          apps: cats[c]
        }));
    });

    function sAppName(app) { const loc = useSettingsStore().locale; const l = (app.lang||{})[loc] || (app.lang||{}).tr; return l && l.name ? l.name : app.name; }
    function sAppDesc(app) { const loc = useSettingsStore().locale; const l = (app.lang||{})[loc] || (app.lang||{}).tr; return l && l.description ? l.description : (app.description||''); }
    return { storeApps, storeCategories, activeCategory, loading, install, uninstall, t, appName: sAppName, appDesc: sAppDesc };
  }
};

/* ── Component Map ── */
const componentMap = {
  calc: CalcApp,
  notepad: NotepadApp,
  fileman: FilemanApp,
  todo: TodoApp,
  weather: WeatherApp,
  settings: SettingsApp,
  terminal: TerminalApp,
  clock: ClockApp,
  calendar: CalendarApp,
  notifications: NotificationsApp,
  appstore: AppStoreApp,
  browser: BrowserApp
};

/* ── Main App ── */
createApp({
  setup() {
    const settingsStore = useSettingsStore();
    const apps = ref(APPS);
    const activeApp = ref(null);
    let currentSubApp = null;

    const CATEGORY_META = APP_CATEGORY_META;

    function getCatName(catId) {
      return getAppCatName(catId, settingsStore.locale);
    }

    const openCats = reactive({});

    function toggleCat(catId) {
      const isOpen = openCats[catId];
      Object.keys(openCats).forEach(k => openCats[k] = false);
      openCats[catId] = !isOpen;
    }

    const menuCategories = computed(() => {
      const cats = {};
      apps.value.forEach(app => {
        const c = app.category || 'other';
        if (!cats[c]) cats[c] = [];
        cats[c].push(app);
      });
      return Object.keys(cats)
        .sort((a, b) => (CATEGORY_META[a]?.order || 99) - (CATEGORY_META[b]?.order || 99))
        .map(c => ({ id: c, icon: CATEGORY_META[c]?.icon || '📦', name: getCatName(c), apps: cats[c] }));
    });
    // Open the first category by default (accordion: only one open at a time)
    watch(menuCategories, (cats) => { if (cats.length && !Object.values(openCats).some(v => v)) openCats[cats[0].id] = true; }, { immediate: true });
    function appName(app) {
      // Built-in apps: use i18n key matching app.id
      const key = app.id;
      const translated = (I18N[settingsStore.locale] || I18N.tr)[key];
      if (translated) return translated;
      // Dynamic/store apps: use lang object from manifest
      if (app.lang) {
        const l = app.lang[settingsStore.locale] || app.lang.tr;
        if (l && l.name) return l.name;
      }
      return app.name;
    }
    function appDesc(app) {
      if (app.lang) {
        const l = app.lang[settingsStore.locale] || app.lang.tr;
        if (l && l.description) return l.description;
      }
      return app.description || '';
    }
    const openWindows = ref([]);
    const currentDesktop = ref(1);
    const iconDesktopMap = ref(JSON.parse(localStorage.getItem('iconDesktopMap') || '{}'));
    const iconCtx = ref({ show: false, x: 0, y: 0, app: null });
    const menuOpen = ref(false);
    const volOpen = ref(false);
    const volStore = useVolumeStore();
    const time = ref('');
    const date = ref('');
    let wbMap = {};
    let subApps = {};
    let clockTimer = null;
    let skipFocusEvent = false;

    function saveIconMap() { localStorage.setItem('iconDesktopMap', JSON.stringify(iconDesktopMap.value)); }

    function getIconDesktops(appId) {
      return iconDesktopMap.value[appId] || [1];
    }

    function isIconOnDesktop(appId, d) {
      return getIconDesktops(appId).includes(d);
    }

    const desktopApps = computed(() => apps.value.filter(a => isIconOnDesktop(a.id, currentDesktop.value)));

    function showIconCtx(e, app) {
      const x = Math.min(e.clientX, window.innerWidth - 200);
      const y = Math.min(e.clientY, window.innerHeight - 280);
      iconCtx.value = { show: true, x, y, app };
    }
    function hideIconCtx() { iconCtx.value.show = false; }

    function moveIcon(appId, targetDesktop) {
      if (targetDesktop === currentDesktop.value) { hideIconCtx(); return; }
      const desktops = getIconDesktops(appId).filter(d => d !== currentDesktop.value);
      if (!desktops.includes(targetDesktop)) desktops.push(targetDesktop);
      iconDesktopMap.value[appId] = desktops;
      saveIconMap();
      hideIconCtx();
    }

    function copyIcon(appId, targetDesktop) {
      const desktops = getIconDesktops(appId);
      if (desktops.includes(targetDesktop)) { hideIconCtx(); return; }
      desktops.push(targetDesktop);
      iconDesktopMap.value[appId] = desktops;
      saveIconMap();
      hideIconCtx();
    }

    const notifCount = ref(0);
    function updateNotifCount() {
      const d = JSON.parse(localStorage.getItem('desktopNotifications') || 'null');
      notifCount.value = d ? d.filter(n => !n.read).length : 2;
    }

    function updateClock() {
      const store = useSettingsStore();
      const loc = LOCALE_MAP[store.locale] || 'tr-TR';
      const opts = store.timezone ? { timeZone: store.timezone } : {};
      const now = new Date();
      time.value = now.toLocaleTimeString(loc, { hour: '2-digit', minute: '2-digit', ...opts });
      date.value = now.toLocaleDateString(loc, { weekday: 'long', month: 'long', day: 'numeric', ...opts });
    }

    const dockAppIds = ['settings', 'appstore', 'browser', 'fileman'];
    const dockApps = computed(() => apps.value.filter(a => dockAppIds.includes(a.id)));
    const gridApps = computed(() => apps.value.filter(a => !dockAppIds.includes(a.id)));

    // Lazy-load per-app CSS for built-in apps (mobile variant)
    const _loadedAppCss = new Set();
    function loadAppCss(appId) {
      if (!appId || _loadedAppCss.has(appId)) return;
      const builtinIds = ['calc','notepad','todo','fileman','weather','settings','terminal','clock','calendar','notifications','appstore','browser'];
      if (!builtinIds.includes(appId)) return;
      _loadedAppCss.add(appId);
      // Load BOTH desktop base AND mobile overrides (mobile.css depends on desktop.css selectors)
      ['desktop', 'mobile'].forEach(kind => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/apps/builtin/' + appId + '/' + kind + '.css';
        link.dataset.builtinAppCss = appId + '-' + kind;
        document.head.appendChild(link);
      });
    }

    function openApp(app) {
      if (currentSubApp) {
        currentSubApp.unmount();
        currentSubApp = null;
      }
      loadAppCss(app.id);
      activeApp.value = app;
      
      if (app.type !== 'external') {
        const comp = componentMap[app.id];
        if (comp) {
          nextTick(() => {
            const mountEl = document.getElementById('mobile-app-mount');
            if (mountEl) {
              mountEl.innerHTML = '<div style="width:100%;height:100%;display:flex;flex-direction:column"></div>';
              const childTarget = mountEl.firstChild;
              currentSubApp = Vue.createApp(comp);
              currentSubApp.use(pinia);
              currentSubApp.use(ElementPlus, EP_LOCALES[useSettingsStore().locale] || EP_LOCALES.en);
              currentSubApp.mount(childTarget);
            }
          });
        }
      }
    }

    function closeApp() {
      activeApp.value = null;
      if (currentSubApp) {
        currentSubApp.unmount();
        currentSubApp = null;
      }
    }

    // ── Locale change: notify store apps ──
    watch(() => settingsStore.locale, (newLocale) => {
      window.dispatchEvent(new CustomEvent('locale-changed', { detail: newLocale }));
    });

    // ── Dynamic app install/uninstall ──
    async function loadDynamicApp(manifest) {
      if (manifest.type === 'external') {
        SIZES[manifest.id] = manifest.size || { w: 800, h: 600 };
        apps.value.push({
          id: manifest.id, name: manifest.name, icon: manifest.icon,
          color: manifest.color, type: 'external', lang: manifest.lang,
          category: manifest.category || 'other'
        });
        return;
      }
      // Internal: fetch template + component + optional style
      try {
        const [tplRes, compRes, styleRes, mobileStyleRes] = await Promise.all([
          fetch('/api/apps/' + manifest.id + '/template'),
          fetch('/api/apps/' + manifest.id + '/component'),
          manifest.hasStyle ? fetch('/api/apps/' + manifest.id + '/style').catch(() => null) : Promise.resolve(null),
          manifest.hasMobileStyle ? fetch('/api/apps/' + manifest.id + '/mobile-style').catch(() => null) : Promise.resolve(null)
        ]);
        if (!tplRes.ok || !compRes.ok) return;
        const templateHtml = await tplRes.text();
        const componentCode = await compRes.text();
        // Inject CSS if available
        if (styleRes && styleRes.ok) {
          const css = await styleRes.text();
          const styleEl = document.createElement('style');
          styleEl.dataset.appId = manifest.id;
          styleEl.textContent = css;
          document.head.appendChild(styleEl);
        }
        // Inject mobile-specific overrides if available (loaded after base style for proper cascade)
        if (mobileStyleRes && mobileStyleRes.ok) {
          const mcss = await mobileStyleRes.text();
          const styleEl = document.createElement('style');
          styleEl.dataset.appId = manifest.id + '-mobile';
          styleEl.textContent = mcss;
          document.head.appendChild(styleEl);
        }
        const compDef = new Function('Vue', 'return ' + componentCode)(Vue);
        compDef.template = templateHtml;
        componentMap[manifest.id] = compDef;
        SIZES[manifest.id] = manifest.size || { w: 480, h: 380 };
        apps.value.push({
          id: manifest.id, name: manifest.name, icon: manifest.icon,
          color: manifest.color, type: 'internal', lang: manifest.lang,
          category: manifest.category || 'other'
        });
      } catch (e) { console.error('Failed to load dynamic app:', manifest.id, e); }
    }

    function removeDynamicApp(appId) {
      // Close window if open
      const win = openWindows.value.find(w => w.id === appId);
      if (win) {
        const wb = wbMap[appId];
        if (wb) wb.close();
      }
      // Remove injected CSS
      const styleEl = document.querySelector('style[data-app-id="' + appId + '"]');
      if (styleEl) styleEl.remove();
      delete componentMap[appId];
      delete SIZES[appId];
      apps.value = apps.value.filter(a => a.id !== appId);
    }

    async function loadInstalledApps() {
      try {
        const res = await fetch('/api/apps');
        if (!res.ok) return;
        const installedApps = await res.json();
        for (const manifest of installedApps) {
          if (apps.value.find(a => a.id === manifest.id)) continue; // skip built-in
          await loadDynamicApp(manifest);
        }
      } catch (e) { console.error('Failed to load installed apps', e); }
    }

    function onAppInstalled(e) { loadDynamicApp(e.detail); }
    function onAppUninstalled(e) { removeDynamicApp(e.detail.id); }

    const visibleWindows = computed(() => openWindows.value.filter(w => w.desktop === currentDesktop.value));

    function desktopHasWindows(d) { return openWindows.value.some(w => w.desktop === d); }

    function focusWindow(win) {
      const wb = wbMap[win.id];
      if (!wb) return;
      if (win.desktop !== currentDesktop.value) {
        switchDesktop(win.desktop);
        return;
      }
      skipFocusEvent = true;
      if (win.minimized) {
        wb.restore();
        openWindows.value.forEach(w => w.focused = false);
        win.minimized = false;
        win.focused = true;
        wb.focus();
      } else {
        wb.minimize();
        win.minimized = true;
        win.focused = false;
      }
      setTimeout(() => { skipFocusEvent = false; }, 50);
    }

    function switchDesktop(d) {
      if (d === currentDesktop.value) return;
      skipFocusEvent = true;
      openWindows.value.forEach(w => {
        const wb = wbMap[w.id];
        if (!wb) return;
        const wbEl = wb.body.parentElement;
        if (w.desktop === currentDesktop.value) {
          wbEl.style.display = 'none';
          w.focused = false;
        }
      });
      currentDesktop.value = d;
      updateWallpaper();
      openWindows.value.forEach(w => {
        const wb = wbMap[w.id];
        if (!wb) return;
        const wbEl = wb.body.parentElement;
        if (w.desktop === d && !w.minimized) {
          wbEl.style.display = '';
        }
      });
      setTimeout(() => { skipFocusEvent = false; }, 50);
    }

    function getWallpaperUrl() {
      const ss = useSettingsStore();
      if (ss.wallpaperMode === 'per') {
        return ss.wallpapers[currentDesktop.value] || '';
      }
      return ss.wallpaperAll || '';
    }

    const desktopStyle = computed(() => {
      const url = getWallpaperUrl();
      if (!url) return {};
      const token = localStorage.getItem('token');
      return {
        backgroundImage: 'url(' + url + (url.includes('?') ? '&' : '?') + 'token=' + token + ')',
        backgroundSize: 'cover',
        backgroundPosition: 'center',
        backgroundRepeat: 'no-repeat'
      };
    });

    function updateWallpaper() {
      // Force computed re-evaluation by touching currentDesktop (already done)
      // Apply via DOM for immediate effect
      const el = document.querySelector('.desktop');
      if (!el) return;
      const url = getWallpaperUrl();
      if (!url) {
        el.style.backgroundImage = '';
        el.style.backgroundSize = '';
        el.style.backgroundPosition = '';
        return;
      }
      const token = localStorage.getItem('token');
      el.style.backgroundImage = 'url(' + url + (url.includes('?') ? '&' : '?') + 'token=' + token + ')';
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
    }

    window._applyWallpaper = updateWallpaper;

    function toggleMenu() { menuOpen.value = !menuOpen.value; }
    function closeMenu() { menuOpen.value = false; volOpen.value = false; }

    function onDocClick(e) {
      const t = e.target;
      if (menuOpen.value && !t.closest('.start-menu') && !t.closest('.start-btn')) {
        menuOpen.value = false;
      }
      if (volOpen.value && !t.closest('.vol-popover') && !t.closest('.vol-wrap')) {
        volOpen.value = false;
      }
      if (iconCtx.value.show && !t.closest('.icon-ctx')) {
        iconCtx.value.show = false;
      }
    }

    function closeAllWindows() {
      const ids = openWindows.value.map(w => w.id);
      ids.forEach(id => {
        const wb = wbMap[id];
        if (wb) { try { wb.close(true); } catch {} }
        if (subApps[id]) { try { subApps[id].unmount(); } catch {} delete subApps[id]; }
        delete wbMap[id];
      });
      openWindows.value = [];
    }

    function setSystemVol(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      volStore.setLevel(pct * 100);
    }

    const isFullscreen = ref(false);
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
    function onFsChange() { isFullscreen.value = !!document.fullscreenElement; }

    // ── WebSocket for real-time notifications ──
    let wsConn = null;
    let reminderAudioCtx = null;
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      wsConn = new WebSocket(proto + '//' + location.host + '/ws');
      wsConn.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'notification' && msg.data) {
            const stored = JSON.parse(localStorage.getItem(NOTIF_STORAGE_KEY) || '[]');
            stored.unshift(msg.data);
            if (stored.length > 200) stored.length = 200;
            localStorage.setItem(NOTIF_STORAGE_KEY, JSON.stringify(stored));
            updateNotifCount();
          }
          if (msg.type === 'reminder-alert' && msg.data) {
            showReminderAlert(msg.data);
          }
        } catch {}
      };
      wsConn.onclose = () => { setTimeout(connectWS, 5000); };
      wsConn.onerror = () => { wsConn.close(); };
    }

    // ── Reminder alert system ──
    const reminderAlert = ref({ show: false, id: '', title: '', note: '', timeStr: '' });
    let reminderAlertQueue = [];
    let reminderSoundTimer = null;

    function playReminderSound() {
      try {
        if (!reminderAudioCtx) reminderAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = reminderAudioCtx;
        // Play a pleasant two-tone chime
        [0, 300, 600].forEach((delay) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(delay === 300 ? 880 : 660, ctx.currentTime + delay / 1000);
          gain.gain.setValueAtTime(0.15, ctx.currentTime + delay / 1000);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay / 1000 + 0.5);
          osc.start(ctx.currentTime + delay / 1000);
          osc.stop(ctx.currentTime + delay / 1000 + 0.5);
        });
      } catch {}
    }

    function showReminderAlert(data) {
      const loc = LOCALE_MAP[useSettingsStore().locale] || 'tr-TR';
      const timeStr = new Date(data.datetime).toLocaleString(loc);
      if (reminderAlert.value.show) {
        // Queue if another alert is already showing
        reminderAlertQueue.push({ ...data, timeStr });
        return;
      }
      reminderAlert.value = { show: true, id: data.id, title: data.title, note: data.note || '', timeStr };
      if (data.sound !== false) {
        playReminderSound();
        // Repeat sound every 8 seconds if not dismissed
        reminderSoundTimer = setInterval(playReminderSound, 8000);
      }
    }

    function dismissReminder() {
      if (reminderSoundTimer) { clearInterval(reminderSoundTimer); reminderSoundTimer = null; }
      const rid = reminderAlert.value.id;
      reminderAlert.value = { show: false, id: '', title: '', note: '', timeStr: '' };
      // Dismiss on server
      if (rid) fetch('/api/reminders/' + rid + '/dismiss', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
      // Show next queued alert
      if (reminderAlertQueue.length) {
        const next = reminderAlertQueue.shift();
        setTimeout(() => showReminderAlert(next), 400);
      }
    }

    function snoozeReminder(minutes) {
      if (reminderSoundTimer) { clearInterval(reminderSoundTimer); reminderSoundTimer = null; }
      const rid = reminderAlert.value.id;
      reminderAlert.value = { show: false, id: '', title: '', note: '', timeStr: '' };
      if (rid) fetch('/api/reminders/' + rid + '/snooze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ minutes }) }).catch(() => {});
      if (reminderAlertQueue.length) {
        const next = reminderAlertQueue.shift();
        setTimeout(() => showReminderAlert(next), 400);
      }
    }

    function openReminderApp() {
      dismissReminder();
      const target = apps.value.find(a => a.id === 'reminder');
      if (target) openApp(target);
    }

    // ── open-app-action handler for notification actions ──
    function onOpenAppAction(e) {
      const action = e.detail || {};
      const appId = action.app;
      if (!appId) return;
      const target = apps.value.find(a => a.id === appId);
      if (!target) return;
      // Set navigation data for the app to pick up
      if (appId === 'rss-reader') {
        window.__rssNavigate = action.data || {};
      }
      openApp(target);
      // Also dispatch specific navigate event if app is already open
      if (appId === 'rss-reader') {
        setTimeout(() => {
          window.dispatchEvent(new CustomEvent('rss-navigate', { detail: action.data || {} }));
        }, 300);
      }
    }

    onMounted(() => {
      updateClock();
      updateNotifCount();
      clockTimer = setInterval(() => { updateClock(); updateNotifCount(); }, 1000);
      document.addEventListener('fullscreenchange', onFsChange);
      document.addEventListener('click', onDocClick, true);
      window.addEventListener('app-installed', onAppInstalled);
      window.addEventListener('app-uninstalled', onAppUninstalled);
      window.addEventListener('open-app-action', onOpenAppAction);
      loadInstalledApps();
      connectWS();
    });
    onUnmounted(() => {
      clearInterval(clockTimer);
      document.removeEventListener('fullscreenchange', onFsChange);
      document.removeEventListener('click', onDocClick, true);
      window.removeEventListener('app-installed', onAppInstalled);
      window.removeEventListener('app-uninstalled', onAppUninstalled);
      window.removeEventListener('open-app-action', onOpenAppAction);
      if (wsConn) wsConn.close();
    });

    return { 
      t, appName, apps, gridApps, dockApps, activeApp, openApp, closeApp,
      time, date
    };
  }
}).use(pinia).use(ElementPlus, EP_LOCALES[localStorage.getItem('sys_locale') || 'tr'] || EP_LOCALES.en).mount('#app');

// Load settings store at boot
const _bootStore = useSettingsStore();
_bootStore.load().then(() => {
  if (window._applyWallpaper) window._applyWallpaper();
});
</script>
