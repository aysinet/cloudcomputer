<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f3460">
<meta name="format-detection" content="telephone=no">
<title>Vue Mobile OS</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<!-- NO WINBOX FOR MOBILE -->
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="https://unpkg.com/vue-demi@0.14.10/lib/index.iife.js"></script>
<script src="https://unpkg.com/pinia@2.3.1/dist/pinia.iife.prod.js"></script>
<link rel="stylesheet" href="https://unpkg.com/ol@10.5.0/ol.css">
<script src="https://unpkg.com/ol@10.5.0/dist/ol.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/simple-mind-map@0.12.1/dist/simpleMindMap.esm.min.css">
<script src="https://unpkg.com/simple-mind-map@0.12.1/dist/simpleMindMap.umd.min.js"></script>
<style>
/* ── Mobile Layout Styles ── */
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
*{scrollbar-width:thin;scrollbar-color:#2a2d35 transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2d35;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a3f4b}
::-webkit-scrollbar-corner{background:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'-apple-system','Segoe UI',sans-serif;background:#000}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);position:relative;}
.mobile-home{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.wallpaper-grid{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.mobile-header{padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
.mobile-clock{color:#fff;font-size:32px;font-weight:300;text-shadow:0 2px 4px rgba(0,0,0,0.5)}
.mobile-date{color:rgba(255,255,255,0.8);font-size:12px;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,0.5)}
.mobile-status{display:flex;gap:8px;color:#fff;font-size:14px;align-items:center;}
.mobile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:24px 16px;overflow-y:auto;z-index:10;flex:1;align-content:start;}
.mobile-icon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:12px;transition:0.1s}
.mobile-icon:active{background:rgba(255,255,255,.15);transform:scale(0.92)}
.icon-img{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.icon-label{color:#fff;font-size:11px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.dock{height:80px;background:rgba(255,255,255,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);margin:0 16px 16px;border-radius:24px;display:flex;align-items:center;justify-content:space-evenly;padding:0 8px;z-index:10;}
.dock .mobile-icon{padding:4px}
.dock .icon-label{display:none}
.app-container{position:absolute;inset:0;background:#fff;z-index:5000;display:flex;flex-direction:column;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);opacity:0;pointer-events:none}
.app-container.open{transform:translateY(0);opacity:1;pointer-events:auto;}
.app-header{height:44px;background:#f0f0f0;display:flex;align-items:center;padding:0 4px;border-bottom:1px solid #ddd;flex-shrink:0}
.app-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#007aff;background:none;border:none;cursor:pointer}
.app-back:active{opacity:0.5}
.app-title{flex:1;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:44px /* balance */}
.app-content{flex:1;position:relative;overflow:hidden;background:#fff;display:flex}
.app-content > *{flex:1;width:100%;height:100%;min-width:0;min-height:0}

/* (Built-in app desktop CSS follows; mobile overrides applied at end of <style>) */


/* ── Fullscreen Toggle ── */
/* ── Desktop Switcher ── */
.desktop-switcher{display:flex;gap:2px;margin-left:8px}
.desktop-switcher .ds-btn{width:18px;height:18px;border:1px solid rgba(255,255,255,.15);border-radius:3px;background:rgba(255,255,255,.06);cursor:pointer;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;padding:3px;transition:.15s;position:relative}
.desktop-switcher .ds-btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25)}
.desktop-switcher .ds-btn.active{background:rgba(100,130,255,.4);border-color:rgba(100,130,255,.6)}
.desktop-switcher .ds-btn .ds-sq{background:rgba(255,255,255,.35);border-radius:1px}
.desktop-switcher .ds-btn.active .ds-sq{background:rgba(255,255,255,.7)}
.desktop-switcher .ds-btn .ds-dot{position:absolute;bottom:0px;left:50%;transform:translateX(-50%);width:4px;height:1.5px;border-radius:1px;background:rgba(255,255,255,.6)}

/* ── Notification Bell ── */
.notif-bell{position:relative;width:32px;height:32px;border-radius:6px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.15s}
.notif-bell:hover{background:rgba(255,255,255,.12);color:#fff}
.notif-badge{position:absolute;top:2px;right:2px;min-width:14px;height:14px;border-radius:7px;background:#f56c6c;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}

/* ── Code App ── */
/* ── File Dialog ── */
.fd-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif}
.fd-dialog{background:#1e1e2e;border:1px solid rgba(255,255,255,.1);border-radius:12px;width:620px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.fd-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.06)}
.fd-header h3{margin:0;font-size:15px;color:#e1e4ea;font-weight:600}
.fd-close{background:none;border:none;color:#808080;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:4px}
.fd-close:hover{color:#f56c6c;background:rgba(255,255,255,.06)}
.fd-toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,.04)}
.fd-breadcrumb{display:flex;align-items:center;gap:2px;flex:1;overflow:hidden}
.fd-bc-item{font-size:12px;color:#6aabf7;cursor:pointer;padding:2px 6px;border-radius:4px;white-space:nowrap}
.fd-bc-item:hover{background:rgba(255,255,255,.06)}
.fd-bc-sep{color:#5a5e72;font-size:11px}
.fd-bc-item.current{color:#e1e4ea;font-weight:600;cursor:default}
.fd-new-folder{background:none;border:1px solid rgba(255,255,255,.1);color:#aab0c6;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.fd-new-folder:hover{background:rgba(255,255,255,.06);color:#fff}
.fd-body{flex:1;overflow-y:auto;padding:8px;min-height:250px}
.fd-empty{text-align:center;color:#5a5e72;padding:40px 0;font-size:13px}
.fd-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;transition:background .12s;color:#c5cde8}
.fd-item:hover{background:rgba(255,255,255,.05)}
.fd-item.selected{background:rgba(74,144,217,.2);color:#fff}
.fd-item-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.fd-item-name{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd-item-size{font-size:11px;color:#5a5e72;min-width:60px;text-align:right}
.fd-item-date{font-size:11px;color:#5a5e72;min-width:100px;text-align:right}
.fd-footer{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02)}
.fd-filename-input{flex:1}
.fd-filter-select{width:160px}
.fd-footer-actions{display:flex;gap:8px;margin-left:auto}
.fd-body::-webkit-scrollbar{width:5px}
.fd-body::-webkit-scrollbar-track{background:transparent}
.fd-body::-webkit-scrollbar-thumb{background:rgba(74,144,217,.2);border-radius:4px}

/* ── Icon Context Menu ── */
.icon-ctx{position:fixed;z-index:9998;background:rgba(30,30,50,.95);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:4px 0;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.icon-ctx-header{padding:6px 14px;font-size:11px;color:rgba(255,255,255,.4);font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.08)}
.icon-ctx-item{padding:7px 14px;font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;display:flex;align-items:center;gap:8px;transition:.12s}
.icon-ctx-item:hover{background:rgba(255,255,255,.12)}
.icon-ctx-item.disabled{opacity:.35;pointer-events:none}
.icon-ctx-sep{height:1px;background:rgba(255,255,255,.08);margin:4px 0}
.icon-ctx-sub{padding:4px 0}
.icon-ctx-sub .icon-ctx-item{padding-left:28px;font-size:12px}

.fs-toggle{position:fixed;top:0;right:0;width:16px;height:16px;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);border:none;cursor:pointer;z-index:8999;clip-path:polygon(100% 0,0 0,100% 100%);display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 2px 0 0;transition:width .3s ease,height .3s ease,background .3s ease,padding .3s ease}
.fs-toggle:hover{width:48px;height:48px;background:rgba(255,255,255,.25);padding:6px 6px 0 0}
.fs-toggle svg{width:14px;height:14px;color:#fff;pointer-events:none;opacity:0;transition:opacity .3s ease}
.fs-toggle:hover svg{opacity:1}

/* ── Reminder Alert Overlay ── */
.reminder-alert-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);animation:remFadeIn .3s}
@keyframes remFadeIn{from{opacity:0}to{opacity:1}}
@keyframes remPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.reminder-alert-box{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(255,200,50,.25);border-radius:16px;padding:28px 32px;min-width:340px;max-width:440px;text-align:center;box-shadow:0 16px 64px rgba(0,0,0,.6),0 0 40px rgba(255,200,50,.1);animation:remPulse 2s ease-in-out infinite}
.reminder-alert-icon{font-size:48px;margin-bottom:8px}
.reminder-alert-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:6px}
.reminder-alert-note{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:4px;word-break:break-word}
.reminder-alert-time{font-size:11px;color:rgba(255,200,50,.7);margin-bottom:16px}
.reminder-alert-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.reminder-alert-btn{height:34px;padding:0 18px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:5px}
.reminder-alert-btn.dismiss{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.reminder-alert-btn.dismiss:hover{background:rgba(255,255,255,.2);color:#fff}
.reminder-alert-btn.snooze{background:rgba(255,200,50,.15);color:#ffc832}
.reminder-alert-btn.snooze:hover{background:rgba(255,200,50,.3);color:#ffd760}
.reminder-alert-btn.open{background:rgba(102,126,234,.2);color:#667eea}
.reminder-alert-btn.open:hover{background:rgba(102,126,234,.35)}
.cal-ev-item .ev-color{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-ev-item .ev-text{flex:1;font-size:13px;color:#303133}
.cal-ev-item .ev-del{border:none;background:transparent;cursor:pointer;color:#c0c4cc;font-size:14px;border-radius:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-ev-item .ev-del:hover{background:#fee;color:#f56c6c}

/* ════════════════════════════════════════════ */
/* MOBILE OVERRIDES (loaded last for priority)  */
/* ════════════════════════════════════════════ */

/* Prevent iOS auto-zoom on input focus (font-size must be >= 16px) */
input,select,textarea,button{font-size:16px;-webkit-appearance:none;appearance:none;border-radius:0}
input[type=checkbox],input[type=radio]{-webkit-appearance:auto;appearance:auto}

/* iOS safe-area insets (notches, home bar) */
.mobile-home{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.app-header{padding-top:env(safe-area-inset-top);height:calc(44px + env(safe-area-inset-top))}

/* Prevent text selection / callout on UI elements */
.mobile-icon,.dock,.app-header,.app-back,.app-title,.mobile-header{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
}

/* Smooth scroll for inner app content */
.app-content,.mobile-grid{-webkit-overflow-scrolling:touch}

/* ── Built-in app overrides for fullscreen mobile rendering ── */

/* Element Plus dropdown popup z-index above app-container */
.el-popper,.el-select-dropdown,.el-picker__popper,.el-message-box__wrapper,.el-overlay,.el-dialog__wrapper{z-index:6000 !important}
.el-dialog{max-width:95vw !important;margin:5vh auto !important}

/* Small screens (<360px): smaller icons */
@media (max-width:360px){
  .mobile-grid{grid-template-columns:repeat(3,1fr);gap:14px 4px;padding:18px 10px}
  .icon-img{width:52px;height:52px;font-size:28px}
  .mobile-clock{font-size:28px}
  .dock{height:72px;margin:0 12px 12px}
}

/* Landscape phones */
@media (orientation:landscape) and (max-height:500px){
  .mobile-grid{grid-template-columns:repeat(8,1fr);padding:12px}
  .mobile-header{padding:6px 16px}
  .mobile-clock{font-size:18px;display:inline-block;margin-right:8px}
  .mobile-date{display:inline-block;font-size:12px;margin-top:0}
  .dock{height:64px;margin:0 12px 8px}
  .icon-img{width:44px;height:44px;font-size:24px}
}

/* Tablet */
@media (min-width:768px){
  .mobile-grid{grid-template-columns:repeat(6,1fr);gap:24px 12px;padding:32px 24px}
  .icon-img{width:64px;height:64px;font-size:34px}
  .icon-label{font-size:13px}
  .dock{max-width:600px;margin:0 auto 16px}
}
</style>
</head>
<body>
<div id="app">
  <div class="mobile-home">
    <div class="wallpaper-grid"></div>
    <div class="mobile-header">
      <div>
        <div class="mobile-clock">{{time}}</div>
        <div class="mobile-date">{{date}}</div>
      </div>
      <div class="mobile-status">
        <span @click="openApp(apps.find(a=>a.id==='settings'))">⚙️</span>
        <span>📶</span>
        <span>🔋88%</span>
      </div>
    </div>
    
    <div class="mobile-grid">
      <div v-for="app in gridApps" :key="app.id" class="mobile-icon" @click="openApp(app)">
        <div class="icon-img" :style="{background:app.color}">{{app.icon}}</div>
        <span class="icon-label">{{appName(app)}}</span>
      </div>
    </div>

    <div class="dock">
      <div v-for="app in dockApps" :key="app.id" class="mobile-icon" @click="openApp(app)">
        <div class="icon-img" :style="{background:app.color}">{{app.icon}}</div>
        <span class="icon-label">{{appName(app)}}</span>
      </div>
    </div>
  </div>

  <div class="app-container" :class="{open: activeApp}">
    <div class="app-header">
      <button class="app-back" @click="closeApp">‹</button>
      <div class="app-title">{{activeApp ? appName(activeApp) : ''}}</div>
    </div>
    <div class="app-content" id="mobile-app-mount">
      <!-- Component mounted here natively via v-if or manually via DOM inside setup() if external -->
      <iframe v-if="activeApp && activeApp.type === 'external'" :src="'/proxy/' + activeApp.id + '/'" style="width:100%;height:100%;border:none;"></iframe>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════ -->
<!-- TEMPLATES                                    -->
<!-- ════════════════════════════════════════════ -->

<script type="text/template" id="CalcApp">
  <div class="calc-root">
    <div class="calc-inner">
      <div class="calc-disp">
        <div class="calc-expr">{{expr}}</div>
        <div class="calc-val">{{display}}</div>
      </div>
      <div class="calc-btns">
        <button class="calc-btn fn" @click="clear">AC</button>
        <button class="calc-btn fn" @click="sign">±</button>
        <button class="calc-btn fn" @click="pct">%</button>
        <button class="calc-btn op" @click="op('/')">÷</button>
        <button v-for="n in [7,8,9]" class="calc-btn num" @click="num(n)">{{n}}</button>
        <button class="calc-btn op" @click="op('*')">×</button>
        <button v-for="n in [4,5,6]" class="calc-btn num" @click="num(n)">{{n}}</button>
        <button class="calc-btn op" @click="op('-')">−</button>
        <button v-for="n in [1,2,3]" class="calc-btn num" @click="num(n)">{{n}}</button>
        <button class="calc-btn op" @click="op('+')">+</button>
        <button class="calc-btn num zero" @click="num(0)">0</button>
        <button class="calc-btn num" @click="dot">.</button>
        <button class="calc-btn eq" @click="eq">=</button>
      </div>
    </div>
  </div>
</script>

<script type="text/template" id="NotepadApp">
  <div class="notepad-root">
    <div class="notepad-toolbar">
      <select v-model="font">
        <option value="'Segoe UI',sans-serif">Segoe UI</option>
        <option value="'Courier New',monospace">Courier New</option>
        <option value="Georgia,serif">Georgia</option>
      </select>
      <input type="number" v-model="size" min="10" max="32">
      <div class="notepad-sep"></div>
      <button class="notepad-tb-btn" @click="bold=!bold" :style="{fontWeight:'bold',background:bold?'#ddd':'#fff'}">B</button>
      <button class="notepad-tb-btn" @click="italic=!italic" :style="{fontStyle:'italic',background:italic?'#ddd':'#fff'}">I</button>
      <div class="notepad-sep"></div>
      <button class="notepad-tb-btn" @click="text=''">{{t('notepadClear')}}</button>
      <button class="notepad-tb-btn" @click="copy">{{t('notepadCopy')}}</button>
    </div>
    <textarea v-model="text" :placeholder="t('notepadPlaceholder')" :style="{fontFamily:font,fontSize:size+'px',fontWeight:bold?'bold':'normal',fontStyle:italic?'italic':'normal'}"></textarea>
    <div class="notepad-status">{{text.length}} {{t('notepadChars')}} · {{wordCount}} {{t('notepadWords')}}</div>
  </div>
</script>

<script type="text/template" id="TodoApp">
  <div class="todo-root">
    <div class="todo-header">
      <h2>{{t('todoTitle')}}</h2>
      <div class="sub">{{done}}/{{todos.length}} {{t('todoCompleted')}}</div>
    </div>
    <div class="todo-add-row">
      <input v-model="input" @keyup.enter="add" :placeholder="t('todoPlaceholder')">
      <button @click="add">{{t('todoAdd')}}</button>
    </div>
    <div class="todo-list">
      <div v-if="!todos.length" class="todo-empty">{{t('todoEmpty')}}</div>
      <div v-for="(td,i) in todos" :key="i" class="todo-item" :class="{done:td.done}">
        <input type="checkbox" v-model="td.done">
        <span>{{td.text}}</span>
        <button class="del" @click="todos.splice(i,1)">✕</button>
      </div>
    </div>
  </div>
</script>

<script type="text/template" id="FilemanApp">
  <div class="fm-root">
    <div class="fm-toolbar">
      <button class="fm-tb-btn">←</button>
      <button class="fm-tb-btn">→</button>
      <button class="fm-tb-btn">↑</button>
      <input class="fm-path" :value="currentPath" readonly>
      <button class="fm-tb-btn">🔍</button>
    </div>
    <div class="fm-main">
      <div class="fm-sidebar">
        <div v-for="loc in locations" class="fm-side-item" :class="{active:loc.id===currentLoc}" @click="navigate(loc)">{{loc.icon}} {{loc.name}}</div>
      </div>
      <div class="fm-files">
        <div v-for="f in files" class="fm-file" :class="{sel:selected===f.name}" @click="selected=f.name" @dblclick="open(f)">
          <span class="ico">{{f.icon}}</span>
          <span class="name">{{f.name}}</span>
        </div>

<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick, watch } = Vue;
const { createPinia, defineStore } = Pinia;

const pinia = createPinia();

const useSettingsStore = defineStore('settings', {
  state: () => ({
    country: '',
    countryCode: '',
    city: '',
    latitude: 0,
    longitude: 0,
    timezone: '',
    locale: localStorage.getItem('sys_locale') || 'tr',
    wallpaperAll: '',
    wallpapers: { 1: '', 2: '', 3: '', 4: '' },
    wallpaperMode: 'all'
  }),
  actions: {
    async load() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) return;
        const s = await res.json();
        this.country = s.country || '';
        this.countryCode = s.countryCode || '';
        this.city = s.city || '';
        this.latitude = s.latitude || 0;
        this.longitude = s.longitude || 0;
        this.timezone = s.timezone || '';
        if (s.locale) { this.locale = s.locale; localStorage.setItem('sys_locale', s.locale); }
        if (s.wallpaperAll) this.wallpaperAll = s.wallpaperAll;
        if (s.wallpapers) this.wallpapers = { ...this.wallpapers, ...s.wallpapers };
        if (s.wallpaperMode) this.wallpaperMode = s.wallpaperMode;
      } catch {}
    },
    async save(data) {
      Object.assign(this, data);
      if (data.locale) localStorage.setItem('sys_locale', data.locale);
      try {
        await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch {}
    }
  }
});

    '.sql': '🗃️', '.yaml': '⚙️', '.yml': '⚙️', '.toml': '⚙️', '.ini': '⚙️',

    '.pdf': '📕', '.doc': '📘', '.docx': '📘', '.xls': '📊', '.xlsx': '📊', '.csv': '📊'
  };

  function fileIcon(name, isDir) {
    if (isDir) return '📁';
    const ext = (name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
    return FILE_ICONS[ext] || '📄';
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function formatDate(d) {
    if (!d) return '';
    try { return new Date(d).toLocaleDateString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    catch { return d; }
  }

  async function loadDir(dirPath) {
    try {
      const r = await fetch('/api/fs/list?path=' + encodeURIComponent(dirPath || ''), { headers: authHeaders() });
      if (r.ok) return await r.json();
    } catch {}
    return [];
  }

  async function readFile(filePath) {
    try {
      const r = await fetch('/api/fs/read?path=' + encodeURIComponent(filePath), { headers: authHeaders() });
      if (r.ok) return await r.json();
    } catch {}
    return null;
  }

  async function writeFile(filePath, content) {
    try {
      const r = await fetch('/api/fs/write', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ filePath, content })
      });
      if (r.ok) return await r.json();
    } catch {}
    return null;
  }

  async function mkdir(dirPath) {
    try {
      const r = await fetch('/api/fs/mkdir', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ dirPath })
      });
      if (r.ok) return await r.json();
    } catch {}
    return null;
  }

  /**
   * Open file dialog
   * @param {Object} opts
   * @param {string} opts.title - dialog title
   * @param {string} opts.mode - 'open' or 'save'
   * @param {string} opts.defaultName - default filename (save mode)
   * @param {Array} opts.filters - [{label:'JavaScript',extensions:['.js','.ts']}, ...]
   * @param {string} opts.initialPath - initial directory path
   * @returns {Promise<{path,name,content}|null>} - selected file info, or null if cancelled
   */
  function show(opts = {}) {
    return new Promise((resolve) => {
      const mode = opts.mode || 'open';
      const title = opts.title || (mode === 'save' ? '💾 Save File' : '📂 Open File');
      const filters = opts.filters || [{ label: 'All Files', extensions: ['*'] }];
      const defaultName = opts.defaultName || '';
      const initialPath = opts.initialPath || '';

      const overlay = document.createElement('div');
      overlay.className = 'fd-overlay';
      let currentDir = initialPath;
      let items = [];
      let selectedItem = null;
      let filenameInput = defaultName;
      let activeFilter = 0;
      let creatingFolder = false;
      let newFolderName = '';

      function pathParts() {
        if (!currentDir) return [{ name: '🏠 Home', path: '' }];
        const parts = [{ name: '🏠 Home', path: '' }];
        const segs = currentDir.split('/').filter(Boolean);
        let acc = '';
        segs.forEach(s => { acc += (acc ? '/' : '') + s; parts.push({ name: s, path: acc }); });
        return parts;
      }

      function filterItems(list) {
        const f = filters[activeFilter];
        if (!f || f.extensions.includes('*')) return list;
        return list.filter(it => it.isDir || f.extensions.some(e => it.name.toLowerCase().endsWith(e.toLowerCase())));
      }

      async function refresh() {
        items = await loadDir(currentDir);
        render();
      }

      function navigateTo(dir) {
        currentDir = dir;
        selectedItem = null;
        filenameInput = mode === 'save' ? filenameInput : '';
        refresh();
      }

      function selectItem(item) {
        if (item.isDir) {
          navigateTo(item.path);
          return;
        }
        selectedItem = item;
        filenameInput = item.name;
        render();
      }

      async function confirm() {
        if (mode === 'open') {
          if (!selectedItem) return;
          const data = await readFile(selectedItem.path);
          cleanup();
          resolve(data ? { path: selectedItem.path, name: selectedItem.name, content: data.content } : null);
        } else {
          if (!filenameInput.trim()) return;
          const fp = currentDir ? currentDir + '/' + filenameInput.trim() : filenameInput.trim();
          cleanup();
          resolve({ path: fp, name: filenameInput.trim() });
        }
      }

      function cancel() { cleanup(); resolve(null); }

      function cleanup() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }

      async function createFolder() {
        if (!newFolderName.trim()) return;
        const fp = currentDir ? currentDir + '/' + newFolName() : newFolName();
        await mkdir(fp);
        creatingFolder = false;
        newFolderName = '';
        refresh();
      }
      function newFolName() { return newFolderName.trim().replace(/[<>:"|?*\\\/]/g, '_'); }

      function render() {
        const filtered = filterItems(items);
        const parts = pathParts();
        overlay.innerHTML = `
          <div class="fd-dialog">
            <div class="fd-header">
              <h3>${title}</h3>
              <button class="fd-close" data-action="cancel">✕</button>
            </div>
            <div class="fd-toolbar">
              <div class="fd-breadcrumb">
                ${parts.map((p, i) => `
                  <span class="fd-bc-item ${i === parts.length - 1 ? 'current' : ''}" data-nav="${p.path}">${p.name}</span>
                  ${i < parts.length - 1 ? '<span class="fd-bc-sep">›</span>' : ''}
                `).join('')}
              </div>
              <button class="fd-new-folder" data-action="newfolder">📁+ New</button>
            </div>
            ${creatingFolder ? `
              <div style="display:flex;gap:6px;padding:6px 16px;align-items:center">
                <input class="fd-nf-input" value="${newFolderName}" placeholder="Folder name" style="flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px 10px;color:#e1e4ea;font-size:13px;outline:none" />
                <button class="fd-new-folder" data-action="confirmfolder">✓</button>
                <button class="fd-new-folder" data-action="cancelfolder">✕</button>
              </div>
            ` : ''}
            <div class="fd-body">
              ${filtered.length === 0 ? '<div class="fd-empty">Empty folder</div>' : ''}
              ${filtered.map((f, i) => `
                <div class="fd-item ${selectedItem && selectedItem.path === f.path ? 'selected' : ''}" data-idx="${i}" data-isdir="${f.isDir}">
                  <span class="fd-item-icon">${fileIcon(f.name, f.isDir)}</span>
                  <span class="fd-item-name">${f.name}</span>
                  <span class="fd-item-size">${f.isDir ? '' : formatSize(f.size)}</span>
                  <span class="fd-item-date">${formatDate(f.modified)}</span>
                </div>
              `).join('')}
            </div>
            <div class="fd-footer">
              <input class="fd-filename-input" value="${filenameInput}" placeholder="${mode === 'save' ? 'Filename...' : 'Select a file...'}" ${mode === 'open' ? 'readonly' : ''} style="flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:7px 12px;color:#e1e4ea;font-size:13px;outline:none" />
              <select class="fd-filter-select" style="background:#2a2a3e;color:#c5cde8;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px 8px;font-size:12px;outline:none;max-width:160px">
                ${filters.map((f, i) => `<option value="${i}" ${i === activeFilter ? 'selected' : ''}>${f.label}</option>`).join('')}
              </select>
              <div class="fd-footer-actions">
                <button style="padding:7px 18px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#c5cde8;cursor:pointer;font-size:13px" data-action="cancel">Cancel</button>
                <button style="padding:7px 18px;border-radius:6px;border:none;background:#0e639c;color:#fff;cursor:pointer;font-size:13px;font-weight:500" data-action="confirm">${mode === 'save' ? 'Save' : 'Open'}</button>
              </div>
            </div>
          </div>
        `;

        // Event bindings
        overlay.querySelector('[data-action="cancel"]')?.addEventListener('click', cancel);
        overlay.querySelectorAll('[data-action="cancel"]').forEach(b => b.addEventListener('click', cancel));
        overlay.querySelector('[data-action="confirm"]')?.addEventListener('click', confirm);
        overlay.querySelector('[data-action="newfolder"]')?.addEventListener('click', () => { creatingFolder = true; render(); });
        overlay.querySelector('[data-action="confirmfolder"]')?.addEventListener('click', () => {
          const inp = overlay.querySelector('.fd-nf-input');
          if (inp) newFolderName = inp.value;
          createFolder();
        });
        overlay.querySelector('[data-action="cancelfolder"]')?.addEventListener('click', () => { creatingFolder = false; render(); });

        // Directory item clicks
        const filteredItems = filterItems(items);
        overlay.querySelectorAll('.fd-item').forEach(el => {
          el.addEventListener('dblclick', () => {
            const idx = parseInt(el.dataset.idx);
            const item = filteredItems[idx];
            if (item) selectItem(item);
          });
          el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.idx);
            const item = filteredItems[idx];
            if (!item) return;
            if (item.isDir) { /* single click on dir: don't enter, just highlight */ }
            else { selectedItem = item; filenameInput = item.name; render(); }
          });
          // Double-click on dir to enter
        });
        // Fix: single click on folder should also enter
        overlay.querySelectorAll('.fd-item[data-isdir="true"]').forEach(el => {
          el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.idx);
            const item = filteredItems[idx];
            if (item) navigateTo(item.path);
          });
        });

        // Breadcrumb nav
        overlay.querySelectorAll('.fd-bc-item:not(.current)').forEach(el => {
          el.addEventListener('click', () => navigateTo(el.dataset.nav));
        });

        // Filename input change
        const fnInput = overlay.querySelector('.fd-filename-input');
        if (fnInput && mode === 'save') {
          fnInput.addEventListener('input', (e) => { filenameInput = e.target.value; });
          fnInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirm(); });
        }

        // Filter select
        const filterSel = overlay.querySelector('.fd-filter-select');
        if (filterSel) {
          filterSel.addEventListener('change', (e) => { activeFilter = parseInt(e.target.value); render(); });
        }

        // Enter folder input
        const nfInput = overlay.querySelector('.fd-nf-input');
        if (nfInput) { nfInput.focus(); nfInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { newFolderName = nfInput.value; createFolder(); } }); }
      }

      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) cancel(); });
      refresh();
    });
  }

  return {
    open(opts = {}) { return show({ ...opts, mode: 'open' }); },
    save(opts = {}) { return show({ ...opts, mode: 'save' }); },
    readFile,
    writeFile,
    loadDir,
    mkdir,
    fileIcon,
    formatSize
  };
})();

function tApp(app) {

const useVolumeStore = defineStore('volume', {
  state: () => ({
    level: parseInt(localStorage.getItem('system_volume') ?? '80', 10),
    muted: false,
    mediaPlaying: false,
    mediaTitle: '',
    mediaHasSource: false
  }),
  getters: {
    icon: (state) => state.muted || state.level === 0 ? '🔇' : state.level > 50 ? '🔊' : '🔉',
    effectiveLevel: (state) => state.muted ? 0 : state.level,
    playIcon: (state) => state.mediaPlaying ? '⏸' : '▶'
  },
  actions: {
    setLevel(val) {
      this.level = Math.max(0, Math.min(100, Math.round(val)));
      this.muted = false;
      localStorage.setItem('system_volume', this.level);
    },
    toggleMute() {
      this.muted = !this.muted;
    },
    registerMedia(handlers) {
      this._mediaHandlers = handlers;
      this.mediaHasSource = true;
    },
    unregisterMedia(handlers) {
      if (this._mediaHandlers === handlers) {
        this._mediaHandlers = null;
        this.mediaHasSource = false;
        this.mediaPlaying = false;
        this.mediaTitle = '';
      }
    },
    updateMediaState(playing, title) {
      this.mediaPlaying = playing;
      this.mediaTitle = title || '';
    },
    mediaToggle() { this._mediaHandlers?.toggle?.(); },
    mediaNext() { this._mediaHandlers?.next?.(); },
    mediaPrev() { this._mediaHandlers?.prev?.(); },
    mediaSeekFwd(sec) { this._mediaHandlers?.seekFwd?.(sec || 10); },
    mediaSeekBack(sec) { this._mediaHandlers?.seekBack?.(sec || 10); }
  }
});
window.__volumeStore = { useVolumeStore };

const CalcApp = {
  template: '#CalcApp',
  props: [],
  emits: [],
  setup(props, { emit }) {
    const display = ref('0'), expr = ref(''), prev = ref(null), pendingOp = ref(null), reset = ref(false);
    function num(n) { if (reset.value) { display.value = String(n); reset.value = false } else { display.value = display.value === '0' ? String(n) : display.value + n } }
    function dot() { if (!display.value.includes('.')) { display.value += '.'; reset.value = false } }
    function clear() { display.value = '0'; expr.value = ''; prev.value = null; pendingOp.value = null }
    function sign() { display.value = String(-parseFloat(display.value)) }
    function pct() { display.value = String(parseFloat(display.value) / 100) }
    function op(o) { prev.value = parseFloat(display.value); pendingOp.value = o; expr.value = display.value + ' ' + o; reset.value = true }
    function eq() {
      if (!pendingOp.value) return;
      const a = prev.value, b = parseFloat(display.value);
      const ops = { '+': (x, y) => x + y, '-': (x, y) => x - y, '*': (x, y) => x * y, '/': (x, y) => x / y };
      expr.value = prev.value + ' ' + pendingOp.value + ' ' + b + ' =';
      const r = ops[pendingOp.value](a, b);
      display.value = String(parseFloat(r.toFixed(10)));
      pendingOp.value = null; reset.value = true;
    }
    return { display, expr, num, dot, clear, sign, pct, op, eq };
  }
};

const WeatherApp = {
  template: '#WeatherApp',
  setup() {
    const settingsStore = useSettingsStore();
    const loading = ref(true);
    const city = ref('');
    const country = ref('');
    const current = ref({ icon: '', temp: 0, desc: '', humidity: 0, wind: 0, feelsLike: 0 });
    const hourly = ref([]);

    const WMO_ICONS = {
      0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
      45:'🌫️', 48:'🌫️',
      51:'🌦️', 53:'🌦️', 55:'🌧️',
      61:'🌧️', 63:'🌧️', 65:'🌧️',
      71:'🌨️', 73:'🌨️', 75:'❄️',
      77:'❄️', 80:'🌦️', 81:'🌧️', 82:'⛈️',
      85:'🌨️', 86:'❄️', 95:'⛈️', 96:'⛈️', 99:'⛈️'
    };
    const WMO_DESC = {
      0:'Açık', 1:'Az bulutlu', 2:'Parçalı bulutlu', 3:'Bulutlu',
      45:'Sisli', 48:'Kırağılı sis',
      51:'Hafif çisenti', 53:'Çisenti', 55:'Yoğun çisenti',
      61:'Hafif yağmur', 63:'Yağmurlu', 65:'Şiddetli yağmur',
      71:'Hafif kar', 73:'Kar yağışı', 75:'Yoğun kar',
      77:'Kar taneleri', 80:'Hafif sağanak', 81:'Sağanak', 82:'Şiddetli sağanak',
      85:'Hafif kar sağanağı', 86:'Kar sağanağı', 95:'Gök gürültülü fırtına', 96:'Dolu ile fırtına', 99:'Şiddetli dolu'
    };

    function getIcon(code) { return WMO_ICONS[code] || '🌡️'; }
    function getDesc(code) {
      const loc = useSettingsStore().locale;
      const descs = WMO_DESC_I18N[loc] || WMO_DESC_I18N.tr;
      return descs[code] || t('weatherUnknown');
    }

    async function fetchWeather() {
      loading.value = true;
      try {
        const res = await fetch('/api/weather');
        if (!res.ok) return;
        const data = await res.json();
        city.value = data.city;
        country.value = data.country;

        const c = data.current;
        const wcode = c.weather_code || 0;
        const t = c.temperature_2m;
        const w = c.wind_speed_10m;
        const fl = t <= 10 && w > 4.8
          ? Math.round(13.12 + 0.6215*t - 11.37*Math.pow(w,0.16) + 0.3965*t*Math.pow(w,0.16))
          : Math.round(t);

        current.value = {
          icon: getIcon(wcode),
          temp: Math.round(t),
          desc: getDesc(wcode),
          humidity: c.relative_humidity_2m || 0,
          wind: Math.round(w),
          feelsLike: fl
        };

        const times = data.hourly.time;
        const temps = data.hourly.temperature_2m;
        const hums = data.hourly.relative_humidity_2m;
        const winds = data.hourly.wind_speed_10m;
        const codes = data.hourly.weather_code;
        const items = [];
        for (let i = 0; i < times.length && items.length < 24; i++) {
          const h = new Date(times[i]).getHours();
          const d = new Date(times[i]);
          if (d < new Date(Date.now() - 3600000)) continue;
          items.push({
            hour: String(h).padStart(2,'0') + ':00',
            icon: codes ? getIcon(codes[i]) : '🌡️',
            temp: Math.round(temps[i]),
            humidity: hums[i]
          });
        }
        hourly.value = items;
      } catch (e) { console.error('Weather fetch error', e); }
      loading.value = false;
    }

    watch(() => settingsStore.city, (newCity, oldCity) => {
      if (newCity && newCity !== oldCity) fetchWeather();
    });

    onMounted(() => fetchWeather());

    return { loading, city, country, current, hourly, t };
  }
};

    const locTimezone = ref('');
    const locLat = ref('');
    const locLng = ref('');

    async function loadCountries() {
      try {
        const res = await fetch('/api/geo/countries');
        if (res.ok) countries.value = await res.json();
      } catch {}
    }

    async function onCountryChange() {
      locCity.value = '';
      cities.value = [];
      timezones.value = [];
      if (!locCountry.value) return;
      try {
        const [cRes, tzRes] = await Promise.all([
          fetch('/api/geo/cities?iso2=' + locCountry.value),
          fetch('/api/geo/timezones?iso2=' + locCountry.value)
        ]);
        if (cRes.ok) cities.value = await cRes.json();
        if (tzRes.ok) timezones.value = await tzRes.json();
        if (timezones.value.length === 1) locTimezone.value = timezones.value[0];
      } catch {}
    }

    function onCityChange() {
      const city = cities.value.find(c => c.city_ascii === locCity.value);
      if (city) {
        locLat.value = city.lat;
        locLng.value = city.lng;
        saveLocation();
      }
    }

    async function saveLocation() {
      const countryObj = countries.value.find(c => c.iso2 === locCountry.value);
      await settingsStore.save({
        country: countryObj ? countryObj.name : '',
        countryCode: locCountry.value,
        city: locCity.value,
        latitude: parseFloat(locLat.value) || 0,
        longitude: parseFloat(locLng.value) || 0,
        timezone: locTimezone.value || ''
      });
    }

    async function loadSettings() {
      if (!settingsStore.countryCode) await settingsStore.load();
      if (settingsStore.countryCode) {
        locCountry.value = settingsStore.countryCode;
        await onCountryChange();
        if (settingsStore.city) locCity.value = settingsStore.city;
        if (settingsStore.timezone) locTimezone.value = settingsStore.timezone;
        if (settingsStore.latitude) locLat.value = settingsStore.latitude;
        if (settingsStore.longitude) locLng.value = settingsStore.longitude;
      }
    }

    onMounted(() => {
      loadCountries();
      loadSettings();
      loadWpList();
    });

    // ── Wallpaper ──
    const wpMode = ref(settingsStore.wallpaperMode || 'all');
    const wpDesktop = ref(1);
    const wpList = ref([]);
    const wpUploading = ref(false);

    const currentWpUrl = computed(() => {
      if (wpMode.value === 'all') return settingsStore.wallpaperAll || '';
      return settingsStore.wallpapers[wpDesktop.value] || '';
    });

    async function loadWpList() {
      try {
        const token = localStorage.getItem('token');
        const res = await fetch('/api/wallpaper', { headers: { 'Authorization': 'Bearer ' + token } });
        if (res.ok) wpList.value = await res.json();
      } catch {}
    }

    function setWpMode(mode) {
      wpMode.value = mode;
      settingsStore.save({ wallpaperMode: mode });
      applyWallpaper();
    }

    function setWallpaper(url) {
      if (wpMode.value === 'all') {
        settingsStore.wallpaperAll = url;
        settingsStore.save({ wallpaperAll: url });
      } else {
        settingsStore.wallpapers[wpDesktop.value] = url;
        settingsStore.save({ wallpapers: { ...settingsStore.wallpapers } });
      }
      applyWallpaper();
    }

    async function uploadWallpaper(e) {
      const file = e.target.files[0];
      if (!file) return;
      wpUploading.value = true;
      try {
        const reader = new FileReader();
        reader.onload = async function(ev) {
          const b64 = ev.target.result.split(',')[1];
          const token = localStorage.getItem('token');
          const res = await fetch('/api/wallpaper/upload', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: file.name, data: b64 })
          });
          if (res.ok) {
            await loadWpList();
            const result = await res.json();
            setWallpaper(result.url);
          }
          wpUploading.value = false;
        };
        reader.readAsDataURL(file);
      } catch { wpUploading.value = false; }
      e.target.value = '';
    }

    async function deleteWallpaper(name) {
      try {
        const token = localStorage.getItem('token');
        await fetch('/api/wallpaper/' + encodeURIComponent(name), {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        // Clear from settings if in use
        const url = '/api/wallpaper/' + encodeURIComponent(name);
        if (settingsStore.wallpaperAll === url) { settingsStore.wallpaperAll = ''; settingsStore.save({ wallpaperAll: '' }); }
        for (let d = 1; d <= 4; d++) {
          if (settingsStore.wallpapers[d] === url) { settingsStore.wallpapers[d] = ''; }
        }
        settingsStore.save({ wallpapers: { ...settingsStore.wallpapers } });
        await loadWpList();
        applyWallpaper();
      } catch {}
    }

    function applyWallpaper() {
      if (window._applyWallpaper) window._applyWallpaper();
    }

    return { active, tabs, currentRows, countries, cities, timezones, locCountry, locCity, locTimezone, locLat, locLng, onCountryChange, onCityChange, saveLocation, selectedLocale, changeLocale, langOptions: LANG_OPTIONS, t, wpMode, wpDesktop, wpList, wpUploading, currentWpUrl, setWpMode, setWallpaper, uploadWallpaper, deleteWallpaper };
  }
};

/* ── TerminalApp ── */
const TerminalApp = {
  template: '#TerminalApp',
  props: [],
  emits: [],
  setup(props, { emit }) {
    const lines = ref([]);
    const inp = ref('');
    const outRef = ref(null);
    const fs = { 'Documents': ['cv.txt', 'notes.md'], 'Downloads': ['setup.zip'], 'Desktop': ['readme.txt'] };
    function run() {
      const c = inp.value.trim(); if (!c) return;
      lines.value.push({ type: 'cmd', text: c });
      const parts = c.split(' '); const cmd = parts[0];
      if (cmd === 'help') lines.value.push({ type: 'res', text: t('termHelpText') });
      else if (cmd === 'ls') lines.value.push({ type: 'res', text: Object.keys(fs).join('  ') });
      else if (cmd === 'date') lines.value.push({ type: 'res', text: new Date().toLocaleString(getIntlLocale()) });
      else if (cmd === 'echo') lines.value.push({ type: 'res', text: parts.slice(1).join(' ') });
      else if (cmd === 'whoami') lines.value.push({ type: 'res', text: t('termUser') });
      else if (cmd === 'pwd') lines.value.push({ type: 'res', text: t('termPwd') });
      else if (cmd === 'clear') { lines.value = []; }
      else lines.value.push({ type: 'err', text: t('termNotFound') + ': ' + cmd + '. ' + t('termHelpHint') });
      inp.value = '';
      nextTick(() => { if (outRef.value) outRef.value.scrollTop = 9999 });
    }
    return { lines, inp, outRef, run, t };
  }
};

/* ── ClockApp ── */
const ClockApp = {
  template: '#ClockApp',
  setup() {
    const settingsStore = useSettingsStore();
    const canvasRef = ref(null);
    const digitalTime = ref('00:00:00');
    const dateStr = ref('');
    const tzLabel = ref(settingsStore.timezone || '');

    function getNow() {
      if (settingsStore.timezone) {
        const str = new Date().toLocaleString('en-US', { timeZone: settingsStore.timezone });
        return new Date(str);
      }
      return new Date();
    }

    function draw() {
      const canvas = canvasRef.value;
      if (!canvas) return;
      const ctx = canvas.getContext('2d'), cx = 100, cy = 100, r = 90;
      const now = getNow();
      ctx.clearRect(0, 0, 200, 200);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 2; ctx.stroke();
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6, x = cx + Math.cos(a - Math.PI / 2) * 78, y = cy + Math.sin(a - Math.PI / 2) * 78;
        ctx.beginPath(); ctx.arc(x, y, 3, 0, 2 * Math.PI); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();
      }
      const hr = now.getHours() % 12, mn = now.getMinutes(), sc = now.getSeconds();
      function hand(a, len, w, color) {
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
        ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();
      }
      hand((hr / 12 + mn / 720) * 2 * Math.PI - Math.PI / 2, 58, 4, 'rgba(255,255,255,.9)');
      hand((mn / 60 + sc / 3600) * 2 * Math.PI - Math.PI / 2, 75, 3, 'rgba(255,255,255,.85)');
      hand(sc / 60 * 2 * Math.PI - Math.PI / 2, 82, 1.5, '#a78bfa');
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 2 * Math.PI); ctx.fillStyle = '#a78bfa'; ctx.fill();

      digitalTime.value = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
      dateStr.value = now.toLocaleDateString(getIntlLocale(), { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    watch(() => settingsStore.timezone, (tz) => {
      tzLabel.value = tz || '';
    });

    let timer = null;
    onMounted(() => {
      draw();
      timer = setInterval(draw, 1000);
    });
    onUnmounted(() => clearInterval(timer));

    return { canvasRef, digitalTime, dateStr, tzLabel };
  }
};

/* ── CalendarApp ── */
const CalendarApp = {
  template: '#CalendarApp',
  setup() {
    const STORAGE_KEY = 'calendarEvents';
    const year = ref(new Date().getFullYear());
    const month = ref(new Date().getMonth());
    const showDialog = ref(false);
    const selectedDate = ref('');
    const newTitle = ref('');
    const newColor = ref('');
    const events = ref(JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'));
    const colorMap = { '': '#409eff', green: '#67c23a', orange: '#e6a23c', red: '#f56c6c', purple: '#6f5ef7' };
    const dayNames = computed(() => {
      const loc = getIntlLocale();
      return Array.from({length:7}, (_,i) => new Intl.DateTimeFormat(loc, {weekday:'short'}).format(new Date(2024,0,1+i)));
    });
    const monthNames = computed(() => {
      const loc = getIntlLocale();
      return Array.from({length:12}, (_,i) => new Intl.DateTimeFormat(loc, {month:'long'}).format(new Date(2024,i,1)));
    });

    function saveEvents() { localStorage.setItem(STORAGE_KEY, JSON.stringify(events.value)); }

    const monthLabel = computed(() => monthNames.value[month.value] + ' ' + year.value);

    const calendarGrid = computed(() => {
      const firstDay = new Date(year.value, month.value, 1);
      let startDay = firstDay.getDay() - 1;
      if (startDay < 0) startDay = 6;
      const daysInMonth = new Date(year.value, month.value + 1, 0).getDate();
      const daysInPrev = new Date(year.value, month.value, 0).getDate();
      const today = new Date();
      const todayStr = [today.getFullYear(), String(today.getMonth()+1).padStart(2,'0'), String(today.getDate()).padStart(2,'0')].join('-');
      const cells = [];
      for (let i = startDay - 1; i >= 0; i--) {
        const d = daysInPrev - i;
        const m = month.value === 0 ? 12 : month.value;
        const y = month.value === 0 ? year.value - 1 : year.value;
        const dateStr = [y, String(m).padStart(2,'0'), String(d).padStart(2,'0')].join('-');
        cells.push({ day: d, date: dateStr, isCurrentMonth: false, isToday: dateStr === todayStr });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = [year.value, String(month.value+1).padStart(2,'0'), String(d).padStart(2,'0')].join('-');
        cells.push({ day: d, date: dateStr, isCurrentMonth: true, isToday: dateStr === todayStr });
      }
      const remaining = 42 - cells.length;
      for (let d = 1; d <= remaining; d++) {
        const m = month.value === 11 ? 1 : month.value + 2;
        const y = month.value === 11 ? year.value + 1 : year.value;
        const dateStr = [y, String(m).padStart(2,'0'), String(d).padStart(2,'0')].join('-');
        cells.push({ day: d, date: dateStr, isCurrentMonth: false, isToday: dateStr === todayStr });
      }
      const weeks = [];
      for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
      return weeks;
    });

    function getEvents(dateStr) { return events.value[dateStr] || []; }

    const dialogDate = computed(() => {
      if (!selectedDate.value) return '';
      const [y, m, d] = selectedDate.value.split('-');
      return parseInt(d) + ' ' + monthNames.value[parseInt(m)-1] + ' ' + y;
    });

    const selectedEvents = computed(() => events.value[selectedDate.value] || []);

    function selectDate(dateStr) {
      selectedDate.value = dateStr;
      showDialog.value = true;
    }

    function openAdd() {
      const now = new Date();
      selectedDate.value = [now.getFullYear(), String(now.getMonth()+1).padStart(2,'0'), String(now.getDate()).padStart(2,'0')].join('-');
      showDialog.value = true;
    }

    function addEvent() {
      if (!newTitle.value.trim()) return;
      if (!events.value[selectedDate.value]) events.value[selectedDate.value] = [];
      events.value[selectedDate.value].push({ title: newTitle.value.trim(), color: newColor.value });
      newTitle.value = '';
      newColor.value = '';
      saveEvents();
    }

    function removeEvent(index) {
      events.value[selectedDate.value].splice(index, 1);
      if (events.value[selectedDate.value].length === 0) delete events.value[selectedDate.value];
      saveEvents();
    }

    function prevMonth() { if (month.value === 0) { month.value = 11; year.value--; } else { month.value--; } }
    function nextMonth() { if (month.value === 11) { month.value = 0; year.value++; } else { month.value++; } }
    function goToday() { const n = new Date(); year.value = n.getFullYear(); month.value = n.getMonth(); }

    return { year, month, showDialog, selectedDate, newTitle, newColor, events, colorMap, dayNames, monthLabel, calendarGrid, getEvents, dialogDate, selectedEvents, selectDate, openAdd, addEvent, removeEvent, prevMonth, nextMonth, goToday, t };
  }
};

/* ── BrowserApp ── */
const BrowserApp = {
  template: '#BrowserApp',
  setup() {
    const urlInput = ref('');
    const currentUrl = ref('');
    const iframeSrc = ref('');
    const loading = ref(false);
    const error = ref('');
    const statusText = ref('');
    const history = ref([]);
    const historyIndex = ref(-1);
    const bookmarks = ref([]);
    const showBookmarks = ref(false);
    const iframeRef = ref(null);

    // Tabs
    const tabs = ref([{ id: 1, url: '', title: '', iframeSrc: '' }]);
    const activeTab = ref(0);
    let tabIdCounter = 2;

    const isSecure = computed(() => currentUrl.value.startsWith('https://'));

    function getToken() { try { return localStorage.getItem('auth_token') || ''; } catch { return ''; } }

    function normalizeUrl(input) {
      let url = input.trim();
      if (!url) return '';
      if (/^https?:\/\//i.test(url)) return url;
      if (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/.test(url)) return 'https://' + url;
      // Treat as search query
      return 'https://www.google.com/search?q=' + encodeURIComponent(url);
    }

    function proxyUrl(url) {
      return '/api/browser/proxy?url=' + encodeURIComponent(url);
    }

    function navigate() {
      const url = normalizeUrl(urlInput.value);
      if (url) loadUrl(url);
    }

    function loadUrl(url) {
      error.value = '';
      loading.value = true;
      currentUrl.value = url;
      urlInput.value = url;
      statusText.value = url;

      iframeSrc.value = proxyUrl(url);

      // Update history
      if (historyIndex.value < history.value.length - 1) {
        history.value = history.value.slice(0, historyIndex.value + 1);
      }
      history.value.push(url);
      historyIndex.value = history.value.length - 1;

      // Update tab
      tabs.value[activeTab.value].url = url;
      tabs.value[activeTab.value].iframeSrc = iframeSrc.value;
    }

    function onIframeLoad() {
      loading.value = false;
      statusText.value = currentUrl.value;
      // Try to get title from response
      try {
        const iframe = iframeRef.value;
        if (iframe && iframe.contentDocument) {
          const title = iframe.contentDocument.title;
          if (title) tabs.value[activeTab.value].title = title;
        }
      } catch { /* cross-origin, ignore */ }
    }

    function goBack() {
      if (historyIndex.value > 0) {
        historyIndex.value--;
        const url = history.value[historyIndex.value];
        currentUrl.value = url;
        urlInput.value = url;
        iframeSrc.value = proxyUrl(url);
        tabs.value[activeTab.value].url = url;
      }
    }

    function goForward() {
      if (historyIndex.value < history.value.length - 1) {
        historyIndex.value++;
        const url = history.value[historyIndex.value];
        currentUrl.value = url;
        urlInput.value = url;
        iframeSrc.value = proxyUrl(url);
        tabs.value[activeTab.value].url = url;
      }
    }

    function reload() {
      if (currentUrl.value) {
        loading.value = true;
        error.value = '';
        // Force reload by appending timestamp
        iframeSrc.value = proxyUrl(currentUrl.value) + '&_t=' + Date.now();
      }
    }

    function goHome() {
      currentUrl.value = '';
      urlInput.value = '';
      iframeSrc.value = '';
      error.value = '';
      statusText.value = '';
      tabs.value[activeTab.value].url = '';
      tabs.value[activeTab.value].title = '';
    }

    // Tabs
    function newTab() {
      tabs.value.push({ id: tabIdCounter++, url: '', title: '', iframeSrc: '' });
      activeTab.value = tabs.value.length - 1;
      currentUrl.value = '';
      urlInput.value = '';
      iframeSrc.value = '';
      error.value = '';
    }

    function switchTab(i) {
      activeTab.value = i;
      const tab = tabs.value[i];
      currentUrl.value = tab.url;
      urlInput.value = tab.url;
      iframeSrc.value = tab.iframeSrc || '';
    }

    function closeTab(i) {
      if (tabs.value.length <= 1) { goHome(); return; }
      tabs.value.splice(i, 1);
      if (activeTab.value >= tabs.value.length) activeTab.value = tabs.value.length - 1;
      switchTab(activeTab.value);
    }

    // Bookmarks
    function toggleBookmarks() { showBookmarks.value = !showBookmarks.value; }
    function addBookmark() {
      if (!currentUrl.value) return;
      if (bookmarks.value.find(b => b.url === currentUrl.value)) return;
      const title = tabs.value[activeTab.value]?.title || currentUrl.value;
      bookmarks.value.push({ url: currentUrl.value, title });
      saveBookmarks();
    }
    function removeBookmark(i) { bookmarks.value.splice(i, 1); saveBookmarks(); }
    function saveBookmarks() { localStorage.setItem('browser_bookmarks', JSON.stringify(bookmarks.value)); }
    function loadBookmarks() {
      try { bookmarks.value = JSON.parse(localStorage.getItem('browser_bookmarks') || '[]'); } catch { bookmarks.value = []; }
    }

    onMounted(() => { loadBookmarks(); window.addEventListener('browser-open-url', onBrowserOpenUrl); });
    onUnmounted(() => { window.removeEventListener('browser-open-url', onBrowserOpenUrl); });

    function onBrowserOpenUrl(e) {
      const url = e.detail;
      if (url) loadUrl(url);
    }

    return {
      urlInput, currentUrl, iframeSrc, loading, error, statusText,
      history, historyIndex, bookmarks, showBookmarks, iframeRef, isSecure,
      tabs, activeTab,
      navigate, loadUrl, onIframeLoad, goBack, goForward, reload, goHome,
      newTab, switchTab, closeTab,
      toggleBookmarks, addBookmark, removeBookmark, t
    };
  }
};

  games: { tr: 'Oyunlar', en: 'Games', de: 'Spiele', fr: 'Jeux', es: 'Juegos', ru: 'Игры', zh: '游戏', ja: 'ゲーム', it: 'Giochi' },
  internet: { tr: 'İnternet', en: 'Internet', de: 'Internet', fr: 'Internet', es: 'Internet', ru: 'Интернет', zh: '互联网', ja: 'インターネット', it: 'Internet' },
