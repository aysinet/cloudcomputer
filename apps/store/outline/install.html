<div class="otl-install-form">
  <div class="otl-install-header">
    <span class="otl-install-icon">📝</span>
    <h3>Outline</h3>
    <p class="otl-install-subtitle" data-i18n="subtitle"></p>
  </div>

  <div class="otl-dep-check" id="otl-dep-check">
    <div class="otl-dep-loading" data-i18n="depChecking"></div>
  </div>

  <div class="otl-install-body" id="otl-install-body" style="display:none">
    <div class="otl-section">
      <h4 data-i18n="pgSection"></h4>
      <div class="otl-info-box" data-i18n="autoInfo"></div>
      <div class="otl-field-row">
        <label data-i18n="labelPgHost"></label>
        <input type="text" id="otl-pg-host" readonly />
      </div>
      <div class="otl-field-row">
        <label data-i18n="labelPgPort"></label>
        <input type="text" id="otl-pg-port" value="5432" readonly />
      </div>
      <div class="otl-field-row">
        <label data-i18n="labelDbName"></label>
        <input type="text" id="otl-pg-database" value="outline" />
      </div>
      <div class="otl-field-row">
        <label data-i18n="labelDbUser"></label>
        <input type="text" id="otl-pg-user" value="outline" />
      </div>
      <div class="otl-field-row">
        <label data-i18n="labelDbPass"></label>
        <div class="otl-password-wrap">
          <input type="password" id="otl-pg-pass" data-i18n-placeholder="placeholderMinChars" autocomplete="new-password" />
          <button type="button" class="otl-eye-btn" onclick="toggleOtlPass('otl-pg-pass')">👁</button>
        </div>
      </div>
    </div>

    <div class="otl-section">
      <h4 data-i18n="redisSection"></h4>
      <div class="otl-field-row">
        <label data-i18n="labelRedisHost"></label>
        <input type="text" id="otl-redis-host" readonly />
      </div>
    </div>

    <div class="otl-section">
      <h4 data-i18n="secretsSection"></h4>
      <div class="otl-info-box" data-i18n="secretsInfo"></div>
      <div class="otl-field-row">
        <label data-i18n="labelSecretKey"></label>
        <input type="text" id="otl-secret-key" readonly />
      </div>
      <div class="otl-field-row">
        <label data-i18n="labelUtilsSecret"></label>
        <input type="text" id="otl-utils-secret" readonly />
      </div>
    </div>

    <div class="otl-install-error" id="otl-install-error" style="display:none"></div>
  </div>

  <div class="otl-install-footer" id="otl-install-footer">
    <button class="otl-cancel-btn" onclick="cancelServiceInstall()" data-i18n="cancel"></button>
    <button class="otl-install-btn" id="otl-confirm-btn" onclick="confirmServiceInstall()" disabled data-i18n="installBtn"></button>
  </div>
</div>

  let otlServices = {};

  function getOtlLocale() { try { return window.__serviceInstallLocale || 'tr'; } catch { return 'tr'; } }
  function otlT(key) { const loc = getOtlLocale(); return (OTL_I18N[loc] || OTL_I18N.tr)[key] || (OTL_I18N.tr)[key] || key; }

  function applyOtlI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = otlT(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = otlT(el.getAttribute('data-i18n-placeholder'));
    });
  }

  function toggleOtlPass(id) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function generateHex(length) {
    const arr = new Uint8Array(length);
    crypto.getRandomValues(arr);
    return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
  }

  async function otlApiFetch(url) {
    const token = document.cookie.split(';').map(c => c.trim()).find(c => c.startsWith('token='));
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token.split('=')[1];
    return fetch(url, { headers });
  }

  async function checkDependencies() {
    const depEl = document.getElementById('otl-dep-check');
    const bodyEl = document.getElementById('otl-install-body');
    const confirmBtn = document.getElementById('otl-confirm-btn');

    try {
      const res = await otlApiFetch('/api/services');
      const services = await res.json();
      otlServices = {};
      services.forEach(s => { otlServices[s.id] = s; });

      const hasPostgres = otlServices.postgres && otlServices.postgres.port;
      const hasRedis = otlServices.redis && otlServices.redis.port;

      if (!hasPostgres || !hasRedis) {
        const missing = [];
        if (!hasPostgres) missing.push(otlT('depPostgres'));
        if (!hasRedis) missing.push(otlT('depRedis'));
        depEl.innerHTML = '<div class="otl-dep-error">' +
          '<p>' + otlT('depMissing') + '</p>' +
          '<ul>' + missing.map(m => '<li>' + m + '</li>').join('') + '</ul>' +
          '</div>';
        bodyEl.style.display = 'none';
        confirmBtn.disabled = true;
        return;
      }

      depEl.innerHTML = '<div class="otl-dep-ok">' + otlT('depOk') + '</div>';
      bodyEl.style.display = 'block';
      confirmBtn.disabled = false;

      // Auto-fill PostgreSQL connection info
      const pgInfo = otlServices.postgres;
      document.getElementById('otl-pg-host').value = pgInfo.containerName || pgInfo.internalHost || 'postgres';
      document.getElementById('otl-pg-port').value = '5432';

      // Auto-fill Redis connection info
      const redisInfo = otlServices.redis;
      document.getElementById('otl-redis-host').value = redisInfo.containerName || redisInfo.internalHost || 'redis';

      // Generate security keys
      document.getElementById('otl-secret-key').value = generateHex(32);
      document.getElementById('otl-utils-secret').value = generateHex(32);
    } catch (e) {
      depEl.innerHTML = '<div class="otl-dep-error"><p>❌ ' + otlT('errorFetch') + ': ' + e.message + '</p></div>';
    }
  }

  function getInstallConfig() {
    const errEl = document.getElementById('otl-install-error');
    const pgHost = document.getElementById('otl-pg-host').value.trim();
    const pgPort = document.getElementById('otl-pg-port').value.trim() || '5432';
    const pgDatabase = document.getElementById('otl-pg-database').value.trim() || 'outline';
    const pgUser = document.getElementById('otl-pg-user').value.trim() || 'outline';
    const pgPass = document.getElementById('otl-pg-pass').value.trim();
    const redisHost = document.getElementById('otl-redis-host').value.trim();
    const secretKey = document.getElementById('otl-secret-key').value.trim();
    const utilsSecret = document.getElementById('otl-utils-secret').value.trim();

    if (pgPass && pgPass.length < 4) { errEl.textContent = otlT('errorDbPass'); errEl.style.display = 'block'; return null; }

    errEl.style.display = 'none';

    // Build PostgreSQL password part for connection string
    const pgPassPart = pgPass ? pgPass : ((otlServices.postgres && otlServices.postgres.installConfig && otlServices.postgres.installConfig.POSTGRES_PASSWORD) || '');
    const databaseUrl = 'postgres://' + pgUser + ':' + encodeURIComponent(pgPassPart) + '@' + pgHost + ':' + pgPort + '/' + pgDatabase;
    const redisUrl = 'redis://' + redisHost + ':6379';

    return {
      SECRET_KEY: secretKey,
      UTILS_SECRET: utilsSecret,
      DATABASE_URL: databaseUrl,
      REDIS_URL: redisUrl,
      PG_HOST: pgHost,
      PG_DATABASE: pgDatabase,
      PG_USER: pgUser
    };
  }

  // Apply i18n and run dependency check on load
  setTimeout(() => { applyOtlI18n(); checkDependencies(); }, 300);
</script>
