  </div>

  </div>
</div>

<script>
  const MONGO_I18N = {
    tr: { subtitle: 'NoSQL veritabanı kuruluma hazır', info: 'MongoDB, kimlik doğrulaması olmadan başlatılacaktır. Kurulumdan sonra güvenlik ayarlarını yapılandırabilirsiniz.', cancel: 'İptal', installBtn: 'Kur ve Başlat' },
    en: { subtitle: 'NoSQL database ready to install', info: 'MongoDB will start without authentication. You can configure security settings after installation.', cancel: 'Cancel', installBtn: 'Install & Start' },
    de: { subtitle: 'NoSQL-Datenbank bereit zur Installation', info: 'MongoDB wird ohne Authentifizierung gestartet. Sie können die Sicherheitseinstellungen nach der Installation konfigurieren.', cancel: 'Abbrechen', installBtn: 'Installieren & Starten' },
    fr: { subtitle: 'Base de données NoSQL prête à installer', info: 'MongoDB démarrera sans authentification. Vous pourrez configurer la sécurité après l\'installation.', cancel: 'Annuler', installBtn: 'Installer & Démarrer' },
    es: { subtitle: 'Base de datos NoSQL lista para instalar', info: 'MongoDB se iniciará sin autenticación. Puede configurar la seguridad después de la instalación.', cancel: 'Cancelar', installBtn: 'Instalar e Iniciar' }
  };

  function getMongoLocale() { try { return window.__serviceInstallLocale || 'tr'; } catch { return 'tr'; } }
  function getMongoI18n(key) { const loc = getMongoLocale(); return (MONGO_I18N[loc] || MONGO_I18N.tr)[key] || (MONGO_I18N.tr)[key] || key; }

  (function applyI18n() {
    const loc = getMongoLocale();
    const t = MONGO_I18N[loc] || MONGO_I18N.tr;
    const sub = document.querySelector('.mongo-install-subtitle');
    if (sub) sub.textContent = t.subtitle;
    const info = document.querySelector('.mongo-install-info');
    if (info) info.textContent = t.info;
    const cancelBtn = document.querySelector('.mongo-cancel-btn');
    if (cancelBtn) cancelBtn.textContent = t.cancel;
    const installBtn = document.querySelector('.mongo-install-btn');
    if (installBtn) installBtn.textContent = t.installBtn;
  })();

  function getInstallConfig() {
    return {};
  }
</script>
