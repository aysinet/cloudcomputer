<div class="pom-root">
  <div class="pom-circle">
    <svg viewBox="0 0 120 120" class="pom-svg">
      <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/>
      <circle cx="60" cy="60" r="54" fill="none" :stroke="isBreak?'#38ef7d':'#ff6b6b'" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="339.292" :stroke-dashoffset="dashOffset"
        style="transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .5s"/>
    </svg>
    <div class="pom-time">{{display}}</div>
    <div class="pom-label">{{isBreak ? 'Mola' : 'Odaklan'}}</div>
  </div>
  <div class="pom-controls">
    <button class="pom-btn" @click="toggle">{{running ? '⏸' : '▶'}}</button>
    <button class="pom-btn" @click="reset">⟳</button>
    <button class="pom-btn" @click="skip">⏭</button>
  </div>
  <div class="pom-stats">
    <div class="pom-stat"><span class="pom-stat-val">{{sessions}}</span><span class="pom-stat-lbl">Oturum</span></div>
    <div class="pom-stat"><span class="pom-stat-val">{{workMin}}</span><span class="pom-stat-lbl">dk</span></div>
  </div>
  <div class="pom-settings">
    <label>Odak: <input type="number" v-model.number="workDuration" min="1" max="60" :disabled="running"> dk</label>
    <label>Mola: <input type="number" v-model.number="breakDuration" min="1" max="30" :disabled="running"> dk</label>
  </div>
</div>
