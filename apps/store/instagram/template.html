<div class="instagram-app">
  <div class="ig-header">
    <div class="ig-logo">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="5"/>
        <circle cx="17.5" cy="6.5" r="1.5" fill="#fff" stroke="none"/>
      </svg>
    </div>
    <div class="ig-title">{{ t.title }}</div>
  </div>
  <p class="ig-subtitle">{{ t.subtitle }}</p>
  <div class="ig-grid">
    <div
      v-for="item in shortcuts"
      :key="item.key"
      class="ig-card"
      @click="openLink(item.url)"
    >
      <span class="ig-card-icon">{{ item.icon }}</span>
      <span class="ig-card-label">{{ t[item.key] }}</span>
    </div>
  </div>
  <button class="ig-open-btn" @click="openLink('https://www.instagram.com/')">
    {{ t.openMain }}
  </button>
  <p class="ig-note">{{ t.popupBlocked }}</p>
</div>
