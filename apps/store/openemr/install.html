<div class="oemr-install-form">
  <div class="oemr-install-header">
    <span class="oemr-install-icon">🏥</span>
    <h3>OpenEMR</h3>
    <p class="oemr-install-subtitle" data-i18n="subtitle"></p>
  </div>

  <div class="oemr-dep-check" id="oemr-dep-check">
    <div class="oemr-dep-loading" data-i18n="depChecking"></div>
  </div>

  <div class="oemr-install-body" id="oemr-install-body" style="display:none">
    <div class="oemr-section">
      <h4 data-i18n="mysqlSection"></h4>
      <div class="oemr-info-box" data-i18n="autoInfo"></div>
      <div class="oemr-field-row">
        <label data-i18n="labelMysqlHost"></label>
        <input type="text" id="oemr-mysql-host" readonly />
      </div>
      <div class="oemr-field-row">
        <label data-i18n="labelMysqlRootPass"></label>
        <input type="text" id="oemr-mysql-root-pass" readonly />
      </div>
      <div class="oemr-field-row">
        <label data-i18n="labelDbName"></label>
        <input type="text" id="oemr-mysql-database" value="openemr" />
      </div>
      <div class="oemr-field-row">
        <label data-i18n="labelDbUser"></label>
        <input type="text" id="oemr-mysql-user" value="openemr" />
      </div>
      <div class="oemr-field-row">
        <label data-i18n="labelDbPass"></label>
        <div class="oemr-password-wrap">
          <input type="password" id="oemr-mysql-pass" data-i18n-placeholder="placeholderMinChars" autocomplete="new-password" />
          <button type="button" class="oemr-eye-btn" onclick="toggleOemrPass('oemr-mysql-pass')">👁</button>
        </div>
      </div>
    </div>

    <div class="oemr-section">
      <h4 data-i18n="redisSection"></h4>
      <div class="oemr-field-row">
        <label data-i18n="labelRedisHost"></label>
        <input type="text" id="oemr-redis-host" readonly />
      </div>
      <div class="oemr-field-row">
        <label data-i18n="labelRedisPass"></label>
        <input type="text" id="oemr-redis-pass" readonly />
      </div>
    </div>

    <div class="oemr-section">
      <h4 data-i18n="adminSection"></h4>
      <div class="oemr-field-row">
        <label data-i18n="labelAdminUser"></label>
        <input type="text" id="oemr-oe-user" value="admin" />
      </div>
      <div class="oemr-field-row">
        <label data-i18n="labelAdminPass"></label>
        <div class="oemr-password-wrap">
          <input type="password" id="oemr-oe-pass" data-i18n-placeholder="placeholderMinChars" autocomplete="new-password" />
          <button type="button" class="oemr-eye-btn" onclick="toggleOemrPass('oemr-oe-pass')">👁</button>
        </div>
      </div>
    </div>

    <div class="oemr-install-error" id="oemr-install-error" style="display:none"></div>
  </div>

  <div class="oemr-install-footer" id="oemr-install-footer">
    <button class="oemr-cancel-btn" onclick="cancelServiceInstall()" data-i18n="cancel"></button>
    <button class="oemr-install-btn" id="oemr-confirm-btn" onclick="confirmServiceInstall()" disabled data-i18n="installBtn"></button>
  </div>
</div>

      labelDbName: 'Nome da base de dados OpenEMR', labelDbUser: 'Utilizador DB OpenEMR', labelDbPass: 'Palavra-passe DB OpenEMR',
      labelRedisHost: 'Host Redis', labelRedisPass: 'Palavra-passe Redis',
      labelAdminUser: 'Nome de utilizador admin', labelAdminPass: 'Palavra-passe admin',
      placeholderMinChars: 'Pelo menos 4 caracteres',
      cancel: 'Cancelar', installBtn: 'Instalar e Iniciar',
      errorDbPass: 'A palavra-passe da BD deve ter pelo menos 4 caracteres',
      errorAdminUser: 'O nome de utilizador admin é obrigatório',
      errorAdminPass: 'A palavra-passe admin deve ter pelo menos 4 caracteres',
      errorFetch: 'Não foi possível obter informações do serviço',
      noPassword: '(sem palavra-passe)'
    }
  };

  let oemrServices = {};

  function getOemrLocale() { try { return window.__serviceInstallLocale || 'tr'; } catch { return 'tr'; } }
  function oemrT(key) { const loc = getOemrLocale(); return (OEMR_I18N[loc] || OEMR_I18N.tr)[key] || (OEMR_I18N.tr)[key] || key; }

  function applyOemrI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = oemrT(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = oemrT(el.getAttribute('data-i18n-placeholder'));
    });
  }

  function toggleOemrPass(id) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  async function oemrApiFetch(url) {
    const token = document.cookie.split(';').map(c => c.trim()).find(c => c.startsWith('token='));
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token.split('=')[1];
    return fetch(url, { headers });
  }

  async function checkDependencies() {
    const depEl = document.getElementById('oemr-dep-check');
    const bodyEl = document.getElementById('oemr-install-body');
    const confirmBtn = document.getElementById('oemr-confirm-btn');

    try {
      const res = await oemrApiFetch('/api/services');
      const services = await res.json();
      oemrServices = {};
      services.forEach(s => { oemrServices[s.id] = s; });

      const hasMysql = oemrServices.mysql && oemrServices.mysql.port;
      const hasRedis = oemrServices.redis && oemrServices.redis.port;

      if (!hasMysql || !hasRedis) {
        const missing = [];
        if (!hasMysql) missing.push(oemrT('depMysql'));
        if (!hasRedis) missing.push(oemrT('depRedis'));
        depEl.innerHTML = '<div class="oemr-dep-error">' +
          '<p>' + oemrT('depMissing') + '</p>' +
          '<ul>' + missing.map(m => '<li>' + m + '</li>').join('') + '</ul>' +
          '</div>';
        bodyEl.style.display = 'none';
        confirmBtn.disabled = true;
        return;
      }

      depEl.innerHTML = '<div class="oemr-dep-ok">' + oemrT('depOk') + '</div>';
      bodyEl.style.display = 'block';
      confirmBtn.disabled = false;

      // Auto-fill MySQL connection info from installed service
      const mysqlInfo = oemrServices.mysql;
      document.getElementById('oemr-mysql-host').value = mysqlInfo.containerName || mysqlInfo.internalHost || 'mysql';
      const mysqlRootPass = (mysqlInfo.installConfig && mysqlInfo.installConfig.MYSQL_ROOT_PASSWORD) || '';
      document.getElementById('oemr-mysql-root-pass').value = mysqlRootPass;

      // Auto-fill Redis connection info
      const redisInfo = oemrServices.redis;
      document.getElementById('oemr-redis-host').value = redisInfo.containerName || redisInfo.internalHost || 'redis';
      const redisPass = (redisInfo.installConfig && redisInfo.installConfig.REDIS_PASSWORD) || '';
      document.getElementById('oemr-redis-pass').value = redisPass || oemrT('noPassword');
    } catch (e) {
      depEl.innerHTML = '<div class="oemr-dep-error"><p>❌ ' + oemrT('errorFetch') + ': ' + e.message + '</p></div>';
    }
  }

  function getInstallConfig() {
    const errEl = document.getElementById('oemr-install-error');
    const mysqlHost = document.getElementById('oemr-mysql-host').value.trim();
    const mysqlRootPass = document.getElementById('oemr-mysql-root-pass').value.trim();
    const mysqlDatabase = document.getElementById('oemr-mysql-database').value.trim() || 'openemr';
    const mysqlUser = document.getElementById('oemr-mysql-user').value.trim() || 'openemr';
    const mysqlPass = document.getElementById('oemr-mysql-pass').value.trim();
    const redisHost = document.getElementById('oemr-redis-host').value.trim();
    const redisPass = document.getElementById('oemr-redis-pass').value.trim();
    const oeUser = document.getElementById('oemr-oe-user').value.trim();
    const oePass = document.getElementById('oemr-oe-pass').value.trim();

    if (mysqlPass && mysqlPass.length < 4) { errEl.textContent = oemrT('errorDbPass'); errEl.style.display = 'block'; return null; }
    if (!oeUser) { errEl.textContent = oemrT('errorAdminUser'); errEl.style.display = 'block'; return null; }
    if (!oePass || oePass.length < 4) { errEl.textContent = oemrT('errorAdminPass'); errEl.style.display = 'block'; return null; }

    errEl.style.display = 'none';

    const config = {
      MYSQL_HOST: mysqlHost,
      MYSQL_ROOT_PASS: mysqlRootPass,
      MYSQL_DATABASE: mysqlDatabase,
      MYSQL_USER: mysqlUser,
      MYSQL_PASS: mysqlPass || mysqlRootPass,
      OE_USER: oeUser,
      OE_PASS: oePass,
      REDIS_SERVER: redisHost
    };

    // Add Redis password if exists
    const rp = (oemrServices.redis && oemrServices.redis.installConfig && oemrServices.redis.installConfig.REDIS_PASSWORD) || '';
    if (rp) config.REDIS_PASSWORD = rp;

    return config;
  }

  // Apply i18n and run dependency check on load
  setTimeout(() => { applyOemrI18n(); checkDependencies(); }, 300);
</script>
