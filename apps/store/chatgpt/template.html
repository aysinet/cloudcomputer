<div class="chatgpt-app">
  <!-- Toolbar -->
  <div class="cg-toolbar">
    <span class="cg-toolbar-title">💬 {{ t.title }}</span>
    <div class="cg-toolbar-actions">
      <button class="cg-btn" @click="navigateHome" :title="t.home">🏠</button>
      <button class="cg-btn" @click="refreshPage" :title="t.refresh">🔄</button>
      <div class="cg-separator"></div>
      <button class="cg-btn" @click="openExternal" :title="t.openTab">🔗</button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="cg-loading" v-if="!iframeLoaded">
    <div class="cg-loading-icon">💬</div>
    <div class="cg-loading-text">{{ t.loading }}</div>
    <div class="cg-spinner"></div>
  </div>

  <!-- ChatGPT iframe -->
  <iframe
    :src="iframeSrc"
    class="cg-iframe"
    frameborder="0"
    referrerpolicy="no-referrer"
    @load="onIframeLoad"
  ></iframe>
</div>
