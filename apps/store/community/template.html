<div class="community-app">

  <!-- ═══ SETUP WIZARD ═══ -->
  <div v-if="view==='setup'" class="community-setup">
    <div class="community-setup-title">🌐 {{t.setupTitle}}</div>
    <div class="community-setup-subtitle">{{t.setupSubtitle}}</div>
    <div class="community-setup-form">
      <div class="community-setup-field">
        <label>{{t.nickname}}</label>
        <input class="community-setup-input" v-model="setupNick" maxlength="20" :placeholder="t.nickPlaceholder" @input="checkNickname">
        <div v-if="setupNick.length>=3" class="community-nick-status" :class="nickStatus">
          {{nickStatus==='available'?t.nickAvailable:nickStatus==='taken'?t.nickTaken:t.nickChecking}}
        </div>
      </div>
      <div class="community-setup-field">
        <label>{{t.avatar}}</label>
        <div class="community-avatar-grid">
          <div v-for="e in avatarEmojis" :key="e" class="community-avatar-option" :class="{selected:setupAvatar===e}" @click="setupAvatar=e;setupAvatarType='emoji'">{{e}}</div>
          <label class="community-avatar-upload-btn" :title="t.uploadAvatar">
            📷
            <input type="file" accept="image/*" hidden @change="handleAvatarUpload">
          </label>
        </div>
        <div v-if="setupAvatarType==='custom'" style="margin-top:6px;font-size:12px;color:#22c55e;">✅ {{t.customAvatarSet}}</div>
      </div>
      <div class="community-setup-field">
        <label>{{t.bio}}</label>
        <textarea class="community-setup-textarea" v-model="setupBio" maxlength="200" :placeholder="t.bioPlaceholder" rows="2"></textarea>
      </div>
      <button class="community-setup-btn" :disabled="!canRegister" @click="doRegister">{{t.joinCommunity}}</button>
    </div>
  </div>

  <!-- ═══ LOADING / CONNECTING ═══ -->
  <div v-else-if="view==='loading'" class="community-loading">
    <div class="community-spinner"></div>
    <div>{{t.connecting}}</div>
  </div>

  <!-- ═══ MAIN APP ═══ -->
  <template v-else>

    <!-- Top Bar -->
    <div class="community-topbar">
      <div class="community-topbar-left">
        <div class="community-topbar-title">🌐 Community</div>
      </div>
      <div class="community-topbar-right">
        <div class="community-topbar-status">
          <span class="dot" :class="{disconnected:connState==='disconnected',connecting:connState==='connecting'}"></span>
          {{connState==='connected'?t.connected:connState==='connecting'?t.reconnecting:t.disconnected}}
        </div>
        <button class="community-btn-icon" @click="openSettings" title="⚙️">⚙️</button>
        <button class="community-btn-icon" @click="showProfile(myProfile)" title="👤">
          <span v-if="myProfile.avatarType==='emoji'">{{myProfile.avatarData}}</span>
          <img v-else :src="myProfile.avatarData" style="width:22px;height:22px;border-radius:50%;">
        </button>
      </div>
    </div>

    <!-- Reconnecting Banner -->
    <div v-if="connState==='disconnected'" class="community-reconnecting">
      <div class="community-spinner" style="width:14px;height:14px;border-width:2px;"></div>
      {{t.reconnecting}}...
    </div>

    <div class="community-main">

      <!-- ═══ SIDEBAR ═══ -->
      <div class="community-sidebar">
        <!-- Chat Rooms -->
        <div class="community-sidebar-section">
          <div class="community-sidebar-label">💬 {{t.chat}}</div>
          <div v-for="r in chatRooms" :key="r.id" class="community-sidebar-item" :class="{active:activePanel==='chat'&&activeRoom===r.id}" @click="openChat(r.id)">
            <span class="icon">{{r.icon}}</span>
            <span>{{r.name}}</span>
            <span v-if="unreadCounts[r.id]" class="badge">{{unreadCounts[r.id]}}</span>
          </div>
        </div>
        <!-- DMs -->
        <div class="community-sidebar-section">
          <div class="community-sidebar-label">📩 {{t.dm}}</div>
          <div v-for="d in dmList" :key="d.oderId" class="community-dm-item" :class="{active:activePanel==='dm'&&activeDm===d.oderId}" @click="openDm(d.oderId)">
            <span class="community-dm-avatar">
              <span v-if="d.avatarType==='emoji'">{{d.avatarData}}</span>
              <img v-else :src="d.avatarData">
            </span>
            <span>{{d.nickname}}</span>
            <span v-if="d.unread" class="badge">{{d.unread}}</span>
          </div>
          <div v-if="!dmList.length" style="padding:4px 14px;font-size:11px;color:#555;">{{t.noDm}}</div>
        </div>
        <!-- Forum -->
        <div class="community-sidebar-section">
          <div class="community-sidebar-label">📋 {{t.forum}}</div>
          <div v-for="c in forumCategories" :key="c.id" class="community-sidebar-item" :class="{active:activePanel==='forum'&&forumCat===c.id}" @click="openForum(c.id)">
            <span class="icon">{{c.icon}}</span>
            <span>{{c.name}}</span>
          </div>
        </div>
        <!-- Games -->
        <div class="community-sidebar-section">
          <div class="community-sidebar-item" :class="{active:activePanel==='games'}" @click="openGames">
            <span class="icon">🎮</span>
            <span>{{t.games}}</span>
          </div>
        </div>
        <!-- Users -->
        <div class="community-sidebar-section">
          <div class="community-sidebar-item" :class="{active:activePanel==='users'}" @click="activePanel='users'">
            <span class="icon">👥</span>
            <span>{{t.users}}</span>
          </div>
        </div>
      </div>

      <!-- ═══ CONTENT AREA ═══ -->
      <div class="community-content">

        <!-- ── Chat View ── -->
        <template v-if="activePanel==='chat'">
          <div class="community-panel-header">
            <div class="community-panel-title">{{currentRoomObj.icon}} {{currentRoomObj.name}}</div>
            <div class="community-panel-info">{{onlineCount}} {{t.online}}</div>
          </div>
          <div class="community-messages" ref="chatMessagesEl" @scroll="onChatScroll">
            <div v-for="m in currentMessages" :key="m.id" class="community-msg">
              <div class="community-msg-avatar">
                <span v-if="m.from.avatarType==='emoji'">{{m.from.avatarData}}</span>
                <img v-else :src="m.from.avatarData">
              </div>
              <div class="community-msg-body">
                <div class="community-msg-header">
                  <span class="community-msg-nick" @click="showProfile(m.from)" style="cursor:pointer;">{{m.from.nickname}}</span>
                  <span class="community-msg-time">{{formatTime(m.ts)}}</span>
                </div>
                <div class="community-msg-text">{{m.content}}</div>
                <div v-if="m.attachments&&m.attachments.length" class="community-msg-attachments">
                  <template v-for="a in m.attachments" :key="a.fileId">
                    <img v-if="isImage(a.mime)" :src="a.thumb||fileUrl(a)" class="community-msg-attach" @click="downloadFile(a)">
                    <div v-else class="community-msg-file" @click="downloadFile(a)">📎 {{a.name}} ({{formatSize(a.size)}})</div>
                  </template>
                </div>
              </div>
            </div>
            <div v-if="!currentMessages.length" class="community-empty">
              <div class="community-empty-icon">💬</div>
              <div>{{t.noMessages}}</div>
            </div>
          </div>
          <!-- Upload preview -->
          <div v-if="pendingFiles.length" class="community-upload-preview">
            <div v-for="(f,i) in pendingFiles" :key="i" class="community-upload-item">
              📎 {{f.name}} ({{formatSize(f.size)}})
              <button class="community-upload-remove" @click="pendingFiles.splice(i,1)">✕</button>
            </div>
          </div>
          <div class="community-input-bar">
            <label class="community-attach-btn" :title="t.attach">
              📎
              <input type="file" hidden multiple @change="handleFileSelect">
            </label>
            <input v-model="chatInput" :placeholder="t.msgPlaceholder" @keydown.enter="sendChat" maxlength="2000">
            <button class="community-send-btn" :disabled="!chatInput.trim()&&!pendingFiles.length" @click="sendChat">{{t.send}}</button>
          </div>
        </template>

        <!-- ── DM View ── -->
        <template v-if="activePanel==='dm'">
          <div class="community-panel-header">
            <div class="community-panel-title">📩 {{dmPartnerProfile.nickname||'...'}}</div>
          </div>
          <div class="community-messages" ref="dmMessagesEl">
            <div v-for="m in dmMessages" :key="m.id||m.ts" class="community-msg">
              <div class="community-msg-avatar">
                <span v-if="m.from.avatarType==='emoji'">{{m.from.avatarData}}</span>
                <img v-else :src="m.from.avatarData">
              </div>
              <div class="community-msg-body">
                <div class="community-msg-header">
                  <span class="community-msg-nick">{{m.from.nickname}}</span>
                  <span class="community-msg-time">{{formatTime(m.ts)}}</span>
                </div>
                <div class="community-msg-text">{{m.content}}</div>
              </div>
            </div>
            <div v-if="!dmMessages.length" class="community-empty">
              <div class="community-empty-icon">📩</div>
              <div>{{t.noDmMessages}}</div>
            </div>
          </div>
          <div class="community-input-bar">
            <input v-model="dmInput" :placeholder="t.msgPlaceholder" @keydown.enter="sendDm" maxlength="2000">
            <button class="community-send-btn" :disabled="!dmInput.trim()" @click="sendDm">{{t.send}}</button>
          </div>
        </template>

        <!-- ── Forum View ── -->
        <template v-if="activePanel==='forum'">
          <!-- Thread List -->
          <template v-if="!forumThread">
            <div class="community-panel-header">
              <div class="community-panel-title">{{currentForumCat.icon}} {{currentForumCat.name}}</div>
              <button class="community-forum-create-btn" @click="showNewThread=true">+ {{t.newThread}}</button>
            </div>
            <div class="community-forum">
              <div v-for="th in forumThreads" :key="th.id" class="community-forum-thread" @click="openThread(th.id)">
                <div class="community-forum-thread-title">
                  <span v-if="th.isPinned" class="community-forum-thread-pinned">📌 </span>
                  {{th.title}}
                </div>
                <div class="community-forum-thread-meta">
                  <span>{{th.author.avatarType==='emoji'?th.author.avatarData:''}} {{th.author.nickname}}</span>
                  <span>{{th.replyCount}} {{t.replies}}</span>
                  <span>{{th.views}} {{t.views}}</span>
                  <span v-if="th.attachments&&th.attachments.length" class="community-forum-thread-attachments">📎 {{th.attachments.length}}</span>
                </div>
              </div>
              <div v-if="!forumThreads.length" class="community-empty">
                <div class="community-empty-icon">📋</div>
                <div>{{t.noThreads}}</div>
              </div>
            </div>
          </template>
          <!-- Thread Detail -->
          <template v-else>
            <div class="community-panel-header">
              <div class="community-panel-title" style="cursor:pointer" @click="forumThread=null">← {{forumThread.title}}</div>
            </div>
            <div class="community-thread-detail">
              <!-- Original Post -->
              <div class="community-thread-post">
                <div class="community-thread-post-header">
                  <span class="community-thread-post-avatar">{{forumThread.author.avatarType==='emoji'?forumThread.author.avatarData:''}}</span>
                  <span class="community-thread-post-nick">{{forumThread.author.nickname}}</span>
                  <span class="community-thread-post-time">{{formatTime(forumThread.createdAt)}}</span>
                </div>
                <div class="community-thread-post-content" v-html="renderMd(forumThread.content)"></div>
              </div>
              <!-- Replies -->
              <div v-for="r in forumThread.replies" :key="r.id" class="community-thread-post">
                <div class="community-thread-post-header">
                  <span class="community-thread-post-avatar">{{r.author.avatarType==='emoji'?r.author.avatarData:''}}</span>
                  <span class="community-thread-post-nick">{{r.author.nickname}}</span>
                  <span class="community-thread-post-time">{{formatTime(r.createdAt)}}</span>
                </div>
                <div class="community-thread-post-content" v-html="renderMd(r.content)"></div>
                <div class="community-reply-like">
                  <button class="community-like-btn" :class="{liked:r.likes&&r.likes.includes(myProfile.userId)}" @click="likeReply(r.id)">
                    👍 {{r.likes?r.likes.length:0}}
                  </button>
                </div>
              </div>
            </div>
            <!-- Reply Input -->
            <div class="community-reply-bar">
              <textarea v-model="replyInput" :placeholder="t.replyPlaceholder" maxlength="5000" @keydown.ctrl.enter="sendReply"></textarea>
              <button class="community-send-btn" :disabled="!replyInput.trim()" @click="sendReply">{{t.send}}</button>
            </div>
          </template>
        </template>

        <!-- ── Games View ── -->
        <template v-if="activePanel==='games'">
          <!-- Game Lobby -->
          <template v-if="!activeGame">
            <div class="community-panel-header">
              <div class="community-panel-title">🎮 {{t.games}}</div>
            </div>
            <div class="community-games">
              <div class="community-games-grid">
                <div v-for="g in gameTypes" :key="g.id" class="community-game-card" @click="createGame(g.id)">
                  <div class="community-game-icon">{{g.icon}}</div>
                  <div class="community-game-name">{{g.name}}</div>
                  <div class="community-game-desc">{{g.desc}}</div>
                </div>
              </div>
              <div v-if="waitingGames.length" class="community-game-lobby">
                <div class="community-game-lobby-title">{{t.openGames}}</div>
                <div v-for="g in waitingGames" :key="g.gameId" class="community-game-room">
                  <div class="community-game-room-info">
                    <span>{{gameIcon(g.gameType)}}</span>
                    <span>{{g.creator.nickname}}</span>
                  </div>
                  <button class="community-game-join-btn" @click="joinGame(g.gameId)">{{t.join}}</button>
                </div>
              </div>
              <div v-if="myWaitingGame" style="margin-top:16px;text-align:center;">
                <div style="color:#888;font-size:13px;margin-bottom:8px;">{{t.waitingOpponent}}</div>
                <button class="community-game-btn" @click="cancelGame">{{t.cancel}}</button>
              </div>
            </div>
          </template>

          <!-- Active Game -->
          <template v-else>
            <div class="community-panel-header">
              <div class="community-panel-title" style="cursor:pointer" @click="leaveGame">← {{gameIcon(activeGame.gameType)}} {{t.game}}</div>
              <div class="community-panel-info">
                {{myProfile.nickname}} vs {{activeGame.opponent.nickname}}
              </div>
            </div>
            <div class="community-game-active">
              <div class="community-game-board-header">
                <span>{{myProfile.avatarType==='emoji'?myProfile.avatarData:''}} {{myProfile.nickname}}</span>
                <span class="community-game-vs">VS</span>
                <span>{{activeGame.opponent.avatarType==='emoji'?activeGame.opponent.avatarData:''}} {{activeGame.opponent.nickname}}</span>
              </div>

              <!-- TicTacToe -->
              <template v-if="activeGame.gameType==='tictactoe'">
                <div class="community-ttt-board">
                  <div v-for="(cell,i) in tttBoard" :key="i" class="community-ttt-cell" :class="{x:cell==='X',o:cell==='O'}" @click="tttMove(i)">
                    {{cell}}
                  </div>
                </div>
                <div style="margin-top:12px;font-size:14px;color:#ccc;">{{tttStatusText}}</div>
              </template>

              <!-- Rock Paper Scissors -->
              <template v-if="activeGame.gameType==='rps'">
                <div class="community-rps">
                  <div style="font-size:14px;color:#ccc;margin-bottom:8px;">{{t.rpsChoose}}</div>
                  <div class="community-rps-choices">
                    <div v-for="c in ['✊','✋','✌️']" :key="c" class="community-rps-choice" :class="{selected:rpsChoice===c}" @click="rpsSelect(c)">{{c}}</div>
                  </div>
                  <div v-if="rpsResult" class="community-rps-result">{{rpsResult}}</div>
                  <div v-if="rpsOpponentChose" style="font-size:13px;color:#888;">{{t.rpsOpponentChose}}</div>
                </div>
              </template>

              <!-- Chess -->
              <template v-if="activeGame.gameType==='chess'">
                <div class="community-chess-labels">
                  <span v-for="f in chessFiles" :key="f">{{f}}</span>
                </div>
                <div class="community-chess-board">
                  <template v-for="(row,ri) in chessDisplayBoard" :key="ri">
                    <div v-for="(cell,ci) in row" :key="ci"
                      class="community-chess-cell"
                      :class="{light:(ri+ci)%2===0, dark:(ri+ci)%2===1, selected:chessSelected&&chessSelected[0]===ri&&chessSelected[1]===ci, 'valid-move':isChessValidTarget(ri,ci), 'last-move':isChessLastMove(ri,ci)}"
                      @click="chessClick(ri,ci)">
                      {{cell}}
                    </div>
                  </template>
                </div>
                <div class="community-chess-labels">
                  <span v-for="f in chessFiles" :key="f">{{f}}</span>
                </div>
                <div style="margin-top:8px;font-size:13px;color:#ccc;">{{chessStatusText}}</div>
                <div class="community-move-list">{{chessMoveList}}</div>
              </template>

              <!-- Backgammon -->
              <template v-if="activeGame.gameType==='backgammon'">
                <div class="community-backgammon">
                  <div class="community-backgammon-board">
                    <div class="community-backgammon-half">
                      <div v-for="(pt,pi) in bgTopPoints" :key="pi" class="community-backgammon-point" :class="{dark:pi%2===0,light:pi%2===1}" @click="bgClick('top',pi)">
                        <div v-for="(ch,chi) in pt" :key="chi" class="community-backgammon-checker" :class="ch"></div>
                      </div>
                    </div>
                    <div style="display:flex;justify-content:center;align-items:center;gap:10px;padding:4px;">
                      <div class="community-backgammon-dice" v-if="bgDice.length">
                        <div v-for="(d,i) in bgDice" :key="i" class="community-backgammon-die">{{d}}</div>
                      </div>
                      <button v-if="bgMyTurn&&!bgDice.length" class="community-game-btn" @click="bgRoll">🎲 {{t.roll}}</button>
                    </div>
                    <div class="community-backgammon-half">
                      <div v-for="(pt,pi) in bgBottomPoints" :key="pi" class="community-backgammon-point bottom" :class="{dark:pi%2===0,light:pi%2===1}" @click="bgClick('bottom',pi)">
                        <div v-for="(ch,chi) in pt" :key="chi" class="community-backgammon-checker" :class="ch"></div>
                      </div>
                    </div>
                  </div>
                  <div style="font-size:13px;color:#ccc;">{{bgStatusText}}</div>
                </div>
              </template>

              <!-- Game Actions -->
              <div class="community-game-actions">
                <button class="community-game-btn danger" @click="resignGame">🏳️ {{t.resign}}</button>
                <button class="community-game-btn" @click="offerDraw">🤝 {{t.drawOffer}}</button>
              </div>
            </div>
          </template>
        </template>

        <!-- ── Users View ── -->
        <template v-if="activePanel==='users'">
          <div class="community-panel-header">
            <div class="community-panel-title">👥 {{t.onlineUsers}}</div>
            <div class="community-panel-info">{{onlineUsers.length}} {{t.online}}</div>
          </div>
          <div style="flex:1;overflow-y:auto;padding:10px;">
            <div v-for="u in onlineUsers" :key="u.oderId" class="community-user-item" @click="showProfile(u)">
              <div class="community-user-avatar">
                <span v-if="u.avatarType==='emoji'">{{u.avatarData}}</span>
                <img v-else :src="u.avatarData">
                <span class="community-user-status" :class="u.status"></span>
              </div>
              <span class="community-user-nick">{{u.nickname}}</span>
            </div>
          </div>
        </template>

        <!-- ── Settings View ── -->
        <template v-if="activePanel==='settings'">
          <div class="community-panel-header">
            <div class="community-panel-title">⚙️ {{t.settings}}</div>
          </div>
          <div class="community-settings">
            <div class="community-settings-section">
              <div class="community-settings-title">{{t.profileSettings}}</div>
              <div class="community-setup-field">
                <label>{{t.nickname}}</label>
                <input class="community-setup-input" v-model="settingsNick" maxlength="20">
              </div>
              <div class="community-setup-field" style="margin-top:10px;">
                <label>{{t.bio}}</label>
                <textarea class="community-setup-textarea" v-model="settingsBio" maxlength="200" rows="2"></textarea>
              </div>
              <div class="community-setup-field" style="margin-top:10px;">
                <label>{{t.avatar}}</label>
                <div class="community-avatar-grid">
                  <div v-for="e in avatarEmojis" :key="e" class="community-avatar-option" :class="{selected:settingsAvatar===e}" @click="settingsAvatar=e;settingsAvatarType='emoji'">{{e}}</div>
                  <label class="community-avatar-upload-btn">📷<input type="file" accept="image/*" hidden @change="handleSettingsAvatarUpload"></label>
                </div>
              </div>
              <div class="community-setup-field" style="margin-top:10px;">
                <label>{{t.status}}</label>
                <div class="community-status-select">
                  <div v-for="s in ['online','away','busy']" :key="s" class="community-status-option" :class="{active:settingsStatus===s}" @click="settingsStatus=s">
                    <span class="status-dot" :class="s" :style="{background:s==='online'?'#22c55e':s==='away'?'#f59e0b':'#ef4444'}"></span>
                  </div>
                </div>
              </div>
              <button class="community-setup-btn" style="margin-top:14px;" @click="saveSettings">{{t.save}}</button>
            </div>
            <div class="community-settings-section">
              <div class="community-settings-title">{{t.stats}}</div>
              <div class="community-profile-stats">
                <div class="community-profile-stat"><span class="community-profile-stat-val">{{myProfile.wins||0}}</span><span class="community-profile-stat-label">{{t.wins}}</span></div>
                <div class="community-profile-stat"><span class="community-profile-stat-val">{{myProfile.losses||0}}</span><span class="community-profile-stat-label">{{t.losses}}</span></div>
                <div class="community-profile-stat"><span class="community-profile-stat-val">{{myProfile.draws||0}}</span><span class="community-profile-stat-label">{{t.draws}}</span></div>
              </div>
            </div>
          </div>
        </template>

        <!-- ── Profile Modal ── -->
        <template v-if="activePanel==='profile'">
          <div class="community-panel-header">
            <div class="community-panel-title" style="cursor:pointer" @click="activePanel=prevPanel">← {{t.profile}}</div>
          </div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;">
            <div class="community-profile-card">
              <div class="community-profile-avatar">
                <span v-if="profileView.avatarType==='emoji'" style="font-size:48px">{{profileView.avatarData}}</span>
                <img v-else :src="profileView.avatarData">
              </div>
              <div class="community-profile-nick">{{profileView.nickname}}</div>
              <div class="community-profile-bio">{{profileView.bio}}</div>
              <div class="community-profile-stats">
                <div class="community-profile-stat"><span class="community-profile-stat-val">{{profileView.wins||0}}</span><span class="community-profile-stat-label">{{t.wins}}</span></div>
                <div class="community-profile-stat"><span class="community-profile-stat-val">{{profileView.losses||0}}</span><span class="community-profile-stat-label">{{t.losses}}</span></div>
                <div class="community-profile-stat"><span class="community-profile-stat-val">{{profileView.draws||0}}</span><span class="community-profile-stat-label">{{t.draws}}</span></div>
                <div class="community-profile-stat"><span class="community-profile-stat-val">{{profileView.forumPosts||0}}</span><span class="community-profile-stat-label">{{t.posts}}</span></div>
              </div>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <button v-if="profileView.userId!==myProfile.userId" class="community-game-btn" @click="openDm(profileView.userId)">📩 {{t.sendDm}}</button>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- ═══ USERS PANEL (RIGHT) ═══ (shown in chat) -->
      <div v-if="activePanel==='chat'" class="community-users-panel">
        <div class="community-users-title">{{t.online}} — {{onlineUsers.length}}</div>
        <div v-for="u in onlineUsers" :key="u.userId" class="community-user-item" @click="showProfile(u)">
          <div class="community-user-avatar">
            <span v-if="u.avatarType==='emoji'">{{u.avatarData}}</span>
            <img v-else :src="u.avatarData">
            <span class="community-user-status" :class="u.status||'online'"></span>
          </div>
          <span class="community-user-nick">{{u.nickname}}</span>
        </div>
      </div>

    </div><!-- /community-main -->
  </template>

  <!-- ═══ NEW THREAD DIALOG ═══ -->
  <div v-if="showNewThread" class="community-dialog-overlay" @click.self="showNewThread=false">
    <div class="community-dialog">
      <div class="community-dialog-title">{{t.newThread}}</div>
      <div class="community-dialog-field">
        <label>{{t.threadTitle}}</label>
        <input v-model="newThreadTitle" maxlength="200">
      </div>
      <div class="community-dialog-field">
        <label>{{t.content}} (Markdown)</label>
        <textarea v-model="newThreadContent" maxlength="10000"></textarea>
      </div>
      <div class="community-dialog-actions">
        <button class="community-dialog-btn secondary" @click="showNewThread=false">{{t.cancel}}</button>
        <button class="community-dialog-btn primary" :disabled="!newThreadTitle.trim()||!newThreadContent.trim()" @click="createThread">{{t.create}}</button>
      </div>
    </div>
  </div>

  <!-- ═══ DRAW OFFER DIALOG ═══ -->
  <div v-if="drawOfferReceived" class="community-dialog-overlay">
    <div class="community-dialog" style="max-width:320px;text-align:center;">
      <div class="community-dialog-title">🤝 {{t.drawOfferReceived}}</div>
      <div class="community-dialog-actions" style="justify-content:center;">
        <button class="community-dialog-btn primary" @click="acceptDraw">{{t.accept}}</button>
        <button class="community-dialog-btn secondary" @click="declineDraw">{{t.decline}}</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div v-if="toast" class="community-toast">{{toast}}</div>

</div>
