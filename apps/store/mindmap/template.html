  <div class="mm-root">
    <!-- Toolbar -->
    <div class="mm-toolbar">
      <div class="mm-toolbar-left">
        <button class="mm-tb-btn" @click="newMap" :title="t('newBtn')">📄</button>
        <button class="mm-tb-btn" @click="openMap" :title="t('openBtn')">📂</button>
        <button class="mm-tb-btn" @click="saveMap" :title="t('saveBtn')">💾</button>
        <button class="mm-tb-btn" @click="saveMapAs" :title="t('saveAsBtn')">📥</button>
        <span class="mm-sep"></span>
        <button class="mm-tb-btn" @click="doUndo" :title="t('undo')">↩️</button>
        <button class="mm-tb-btn" @click="doRedo" :title="t('redo')">↪️</button>
        <span class="mm-sep"></span>
        <button class="mm-tb-btn" @click="addChild" :title="t('addChild')">➕🔽</button>
        <button class="mm-tb-btn" @click="addSibling" :title="t('addSibling')">➕➡️</button>
        <button class="mm-tb-btn" @click="removeNode" :title="t('deleteNode')">🗑️</button>
        <span class="mm-sep"></span>
        <button class="mm-tb-btn" @click="fitCanvas" :title="t('fit')">🔲</button>
        <button class="mm-tb-btn" @click="zoomIn" :title="t('zoomIn')">🔍+</button>
        <button class="mm-tb-btn" @click="zoomOut" :title="t('zoomOut')">🔍-</button>
      </div>
      <div class="mm-toolbar-right">
        <select class="mm-select" :value="currentLayout" @change="changeLayout($event.target.value)">
          <option value="logicalStructure">{{t('logical')}}</option>
          <option value="mindMap">{{t('mindMapLayout')}}</option>
          <option value="organizationStructure">{{t('organization')}}</option>
          <option value="catalogOrganization">{{t('catalog')}}</option>
          <option value="timeline">{{t('timeline')}}</option>
          <option value="fishbone">{{t('fishbone')}}</option>
        </select>
        <select class="mm-select" :value="currentTheme" @change="changeTheme($event.target.value)">
          <option value="default">{{t('themeDefault')}}</option>
          <option value="classic">{{t('classic')}}</option>
          <option value="dark">{{t('dark')}}</option>
          <option value="freshGreen">{{t('green')}}</option>
          <option value="blueSky">{{t('blue')}}</option>
          <option value="brainImpairedPink">{{t('pink')}}</option>
          <option value="earthYellow">{{t('earth')}}</option>
          <option value="romanticPurple">{{t('purple')}}</option>
        </select>
        <!-- Recent files dropdown -->
        <div class="mm-recent-wrap" v-if="recentFiles.length">
          <button class="mm-tb-btn" @click="showRecent = !showRecent" :title="t('recentFiles')">📋</button>
          <div class="mm-recent-dropdown" v-if="showRecent">
            <div class="mm-recent-header">{{t('recentFiles')}}</div>
            <div class="mm-recent-item" v-for="(rf, idx) in recentFiles" :key="idx" @click="openRecent(rf)">
              <span class="mm-recent-icon">🧠</span>
              <div class="mm-recent-info">
                <div class="mm-recent-name">{{ rf.name }}</div>
                <div class="mm-recent-path">{{ rf.path }}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Current file indicator -->
    <div class="mm-file-bar" v-if="currentFilePath">
      <span>📄 {{ currentFilePath }}</span>
      <span v-if="isDirty" style="color:#ff6b6b;margin-left:6px">● {{t('modified')}}</span>
    </div>
    <!-- Mind map container -->
    <div class="mm-container" ref="mmContainer"></div>
  </div>
