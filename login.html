<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Aysi Cloud Computer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; min-height: 100vh; }
    .bg-animate { background-size: 400% 400%; animation: gradientShift 12s ease infinite; }
    @keyframes gradientShift {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .glass { background: rgba(255,255,255,.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #1e1e3a inset !important; -webkit-text-fill-color: #fff !important; }
  </style>
</head>
<body class="bg-gradient-to-br from-[#0f0c29] via-[#302b63] to-[#24243e] bg-animate flex items-center justify-center min-h-screen">

  <div class="glass rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-8">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-3xl shadow-lg mb-4">
        🖥️
      </div>
      <h1 class="text-white text-xl font-semibold tracking-wide">Aysi Cloud Computer</h1>
      <p id="subtitle" class="text-white/40 text-sm mt-1"></p>
    </div>

    <!-- Form -->
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="mb-4">
        <label id="lblUsername" class="block text-white/50 text-xs font-medium mb-1.5 uppercase tracking-wider"></label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30 text-sm">👤</span>
          <input id="username" type="text" required autocomplete="username"
            class="w-full h-11 pl-10 pr-4 rounded-lg bg-white/5 border border-white/10 text-white text-sm placeholder-white/20 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            placeholder="admin">
        </div>
      </div>

      <div class="mb-6">
        <label id="lblPassword" class="block text-white/50 text-xs font-medium mb-1.5 uppercase tracking-wider"></label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30 text-sm">🔒</span>
          <input id="password" type="password" required autocomplete="current-password"
            class="w-full h-11 pl-10 pr-4 rounded-lg bg-white/5 border border-white/10 text-white text-sm placeholder-white/20 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            placeholder="••••••••">
        </div>
      </div>

      <!-- Error -->
      <div id="errorMsg" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center"></div>

      <button type="submit" id="submitBtn"
        class="w-full h-11 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium text-sm cursor-pointer hover:from-indigo-500 hover:to-purple-500 transition-all duration-200 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span id="btnText"></span>
        <svg id="btnSpinner" class="hidden animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25"></circle>
          <path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="opacity-75"></path>
        </svg>
      </button>
    </form>

    <!-- 2FA Verification Step -->
    <div id="twoFASection" class="hidden">
      <div class="flex flex-col items-center mb-4">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-2xl shadow-lg mb-3">🔐</div>
        <h2 id="twoFATitle" class="text-white text-lg font-semibold"></h2>
        <p id="twoFASubtitle" class="text-white/40 text-sm mt-1"></p>
      </div>

      <div class="mb-4">
        <input id="twoFACode" type="text" maxlength="6" inputmode="numeric" autocomplete="one-time-code"
          class="w-full h-12 text-center text-xl tracking-[0.5em] rounded-lg bg-white/5 border border-white/10 text-white placeholder-white/20 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition font-mono"
          placeholder="000000">
      </div>

      <div id="twoFAError" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center"></div>

      <button id="twoFASubmitBtn" onclick="verify2FA()"
        class="w-full h-11 rounded-lg bg-gradient-to-r from-amber-600 to-orange-600 text-white font-medium text-sm cursor-pointer hover:from-amber-500 hover:to-orange-500 transition-all duration-200 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span id="twoFABtnText"></span>
        <svg id="twoFASpinner" class="hidden animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25"></circle>
          <path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="opacity-75"></path>
        </svg>
      </button>

      <button id="backBtn" onclick="back2FA()" class="w-full h-9 mt-2 rounded-lg bg-white/5 text-white/50 text-sm cursor-pointer hover:bg-white/10 transition border-none">
      </button>
    </div>

    <p class="text-center text-white/20 text-xs mt-6">Aysi Cloud Computer OS &copy; 2026</p>
  </div>

  <script>

        serverError:'Ошибка подключения к серверу', twoFATitle:'Двухфакторная аутентификация',

        login:'登录', loggingIn:'登录中...', loginFailed:'登录失败',
        serverError:'服务器连接错误', twoFATitle:'双因素认证',
        twoFASubtitle:'输入您身份验证器应用中的6位数代码',
        verify:'验证', verifying:'验证中...', verifyFailed:'验证失败',
        enter6Digit:'输入6位数代码', back:'← 返回' },
      ja: { subtitle:'続行するにはログインしてください', username:'ユーザー名', password:'パスワード',
        login:'ログイン', loggingIn:'ログイン中...', loginFailed:'ログイン失敗',
        serverError:'サーバー接続エラー', twoFATitle:'二要素認証',
        twoFASubtitle:'認証アプリの6桁のコードを入力してください',
        verify:'確認', verifying:'確認中...', verifyFailed:'確認失敗',
        enter6Digit:'6桁のコードを入力', back:'← 戻る' },
      it: { subtitle:'Accedi per continuare', username:'Nome utente', password:'Password',
        login:'Accedi', loggingIn:'Accesso...', loginFailed:'Accesso fallito',

        twoFASubtitle:"Inserisci il codice a 6 cifre dalla tua app di autenticazione",

        login:'تسجيل الدخول', loggingIn:'جارٍ تسجيل الدخول...', loginFailed:'فشل تسجيل الدخول',
        serverError:'خطأ في الاتصال بالخادم', twoFATitle:'المصادقة الثنائية',
        twoFASubtitle:'أدخل الرمز المكون من 6 أرقام من تطبيق المصادقة',
        verify:'تحقق', verifying:'جارٍ التحقق...', verifyFailed:'فشل التحقق',
        enter6Digit:'أدخل الرمز المكون من 6 أرقام', back:'← رجوع' },
      ko: { subtitle:'계속하려면 로그인하세요', username:'사용자 이름', password:'비밀번호',
        login:'로그인', loggingIn:'로그인 중...', loginFailed:'로그인 실패',
        serverError:'서버 연결 오류', twoFATitle:'2단계 인증',
        twoFASubtitle:'인증 앱의 6자리 코드를 입력하세요',
        verify:'확인', verifying:'확인 중...', verifyFailed:'확인 실패',
        enter6Digit:'6자리 코드 입력', back:'← 뒤로' },
      hi: { subtitle:'जारी रखने के लिए लॉगिन करें', username:'उपयोगकर्ता नाम', password:'पासवर्ड',
        login:'लॉगिन', loggingIn:'लॉगिन हो रहा है...', loginFailed:'लॉगिन विफल',
        serverError:'सर्वर कनेक्शन त्रुटि', twoFATitle:'दो-कारक प्रमाणीकरण',
        twoFASubtitle:'अपने प्रमाणक ऐप से 6 अंकों का कोड दर्ज करें',
        verify:'सत्यापित करें', verifying:'सत्यापित हो रहा है...', verifyFailed:'सत्यापन विफल',
        enter6Digit:'6 अंकों का कोड दर्ज करें', back:'← वापस' },
      pt: { subtitle:'Faça login para continuar', username:'Nome de usuário', password:'Senha',
        login:'Entrar', loggingIn:'Entrando...', loginFailed:'Falha no login',
        serverError:'Erro de conexão com o servidor', twoFATitle:'Autenticação de dois fatores',
        twoFASubtitle:'Digite o código de 6 dígitos do seu aplicativo autenticador',
        verify:'Verificar', verifying:'Verificando...', verifyFailed:'Falha na verificação',
        enter6Digit:'Digite o código de 6 dígitos', back:'← Voltar' }
    };

    // Detect language from browser or localStorage
    function detectLang() {
      const stored = localStorage.getItem('login_locale');
      if (stored && LOGIN_I18N[stored]) return stored;
      const nav = (navigator.language || navigator.userLanguage || 'en').split('-')[0].toLowerCase();
      return LOGIN_I18N[nav] ? nav : 'en';
    }

    let currentLang = detectLang();
    function t(key) { return (LOGIN_I18N[currentLang] || LOGIN_I18N.en)[key] || LOGIN_I18N.en[key] || key; }

    function applyI18n() {
      document.documentElement.lang = currentLang;
      document.title = t('login') + ' — Aysi Cloud Computer';
      document.getElementById('subtitle').textContent = t('subtitle');
      document.getElementById('lblUsername').textContent = t('username');
      document.getElementById('lblPassword').textContent = t('password');
      document.getElementById('btnText').textContent = t('login');
      document.getElementById('twoFATitle').textContent = t('twoFATitle');
      document.getElementById('twoFASubtitle').textContent = t('twoFASubtitle');
      document.getElementById('twoFABtnText').textContent = t('verify');
      document.getElementById('backBtn').textContent = t('back');
    }

    applyI18n();

    // If already has token cookie, the server will serve index.html
    // Check localStorage token and verify with server
    (async () => {
      const token = localStorage.getItem('token');
      if (token) {
        try {
          const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
          if (res.ok) {
            // Redirect loop guard: if we were redirected here within the last 3 seconds,
            // the cookie is missing/expired while localStorage token is still valid.
            // Clear stale localStorage token and show login form instead of looping.
            const now = Date.now();
            const last = parseInt(sessionStorage.getItem('_loginRedirectTs') || '0');
            if (last && (now - last) < 3000) {
              sessionStorage.removeItem('_loginRedirectTs');
              localStorage.removeItem('token');
              localStorage.removeItem('auth_token');
            } else {
              sessionStorage.setItem('_loginRedirectTs', String(now));
              window.location.href = '/';
              return;
            }
          }
        } catch {}
        localStorage.removeItem('token');
        localStorage.removeItem('auth_token');
      }
      sessionStorage.removeItem('_loginRedirectTs');
    })();

    let pendingTempToken = null;

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = t('loggingIn');
      btnSpinner.classList.remove('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.requires2FA) {
          // Show 2FA step
          pendingTempToken = data.tempToken;
          document.getElementById('loginForm').classList.add('hidden');
          document.getElementById('twoFASection').classList.remove('hidden');
          document.getElementById('twoFACode').focus();
        } else if (res.ok && data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('auth_token', data.token);
          window.location.href = '/';
        } else {
          errorMsg.textContent = data.error || t('loginFailed');
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = t('serverError');
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = t('login');
        btnSpinner.classList.add('hidden');
      }
      return false;
    }

    async function verify2FA() {
      const code = document.getElementById('twoFACode').value.trim();
      const errorEl = document.getElementById('twoFAError');
      const btn = document.getElementById('twoFASubmitBtn');
      const btnText = document.getElementById('twoFABtnText');
      const spinner = document.getElementById('twoFASpinner');

      if (!code || code.length !== 6) {
        errorEl.textContent = t('enter6Digit');
        errorEl.classList.remove('hidden');
        return;
      }

      errorEl.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = t('verifying');
      spinner.classList.remove('hidden');

      try {
        const res = await fetch('/api/login/2fa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tempToken: pendingTempToken, code })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('auth_token', data.token);
          window.location.href = '/';
        } else {
          errorEl.textContent = data.error || t('verifyFailed');
          errorEl.classList.remove('hidden');
        }
      } catch {
        errorEl.textContent = t('serverError');
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btnText.textContent = t('verify');
        spinner.classList.add('hidden');
      }
    }

    function back2FA() {
      pendingTempToken = null;
      document.getElementById('twoFASection').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('twoFACode').value = '';
      document.getElementById('twoFAError').classList.add('hidden');
    }

    // Enter key on 2FA input
    document.addEventListener('DOMContentLoaded', () => {
      const codeInput = document.getElementById('twoFACode');
      if (codeInput) codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') verify2FA(); });
    });
  </script>
</body>
</html>
