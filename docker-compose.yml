services:
  # ══════════════════════════════════════════════════════════
  # INFRASTRUCTURE (managed by superadmin, shared across all instances)
  # ══════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama
    container_name: cloudpc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - cloudpc-net
    restart: always

  # ══════════════════════════════════════════════════════════
  # CLOUDCOMPUTER INSTANCE (one per deployment / user group)
  # ══════════════════════════════════════════════════════════
  cloudcomputer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudcomputer-${INSTANCE_ID:-default}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - IS_DOCKER=true
      - INSTANCE_ID=${INSTANCE_ID:-default}
      - DOCKER_MANAGER_URL=http://docker-manager-${INSTANCE_ID:-default}:9800
      - DM_SECRET=cloudpc-docker-manager-secret
      - OLLAMA_URL=http://cloudpc-ollama:11434
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
    volumes:
      - cloudpc-data:/app/data
    networks:
      - cloudpc-net
    depends_on:
      - docker-manager
      - ollama
    restart: unless-stopped

  docker-manager:
    build:
      context: .
      dockerfile: Dockerfile.docker-manager
    container_name: docker-manager-${INSTANCE_ID:-default}
    environment:
      - DOCKER_NETWORK=cloudpc-net
      - DM_SECRET=cloudpc-docker-manager-secret
      - DM_PORT=9800
      - DM_PORT_START=9000
      - DM_PORT_END=9999
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cloudpc-dm-data:/data
    networks:
      - cloudpc-net
    restart: unless-stopped

networks:
  cloudpc-net:
    name: cloudpc-net
    driver: bridge

volumes:
  ollama_models:
    name: cloudpc-ollama-models
  cloudpc-data:
    name: cloudpc-${INSTANCE_ID:-default}-data
  cloudpc-dm-data:
    name: cloudpc-${INSTANCE_ID:-default}-dm-data
